# ============================================================================
# TRIGGER-TIME TREE (separate from "preselection" -- see below for why)
#
# selection/src/framework.cc dispatches branch construction on the tree's
# "mode" field. A branch with type = "event" is only legal when mode =
# "event" (framework.cc line ~596); the Mode::Reco and Mode::True branches
# of construct() (lines ~423, ~263) have no "event" case at all, which is
# exactly why trigger_within_gate could not be added to the "preselection"
# tree above (mode = "reco"). This tree isolates the event-scope variables
# in their own mode = "event" tree so the build succeeds.
#
# Consequence: mode = "event" trees emit ONE ROW PER TRIGGERED EVENT, not
# one row per reconstructed interaction, and the Mode::Event branch of
# construct() (framework.cc line ~582) only ever applies event-type cuts --
# a reco-type cut like fiducial_cut would be parsed but silently never
# evaluated in this mode, so it is deliberately left out here rather than
# included and have it do nothing.
#
# This is not a problem for the plot itself: Howard's Fig. 7/8 trigger-time
# plot (main text, Sec. 3.2) is exactly this -- one entry per event, stacked
# by SAMPLE identity (nu+cosmic MC / offbeam in-time cosmic / onbeam data,
# with rock muons as an additional component in Fig. 8), not split by
# interaction-level true_category. So this tree's row-per-event structure
# is the correct unit for that plot, not a limitation relative to it.
#
# Cuts: trigger_emulation_cut + data_quality_cut, matching the cuts already
# used for the "preselection" tree above and matching Howard's more complete
# Fig. 8 version (Fig. 7 uses only the emulated-trigger cut; Fig. 8 adds the
# data-quality cut on beam/offbeam data). crtpmt_veto is deliberately NOT
# applied -- that is Roy's cut, not Howard's, and conflating the two was
# already flagged as a mistake to avoid in this analysis.
# ============================================================================
[[tree]]
name = "trigger_time"
sim_only = false
add_systematics = false
add_exposure = true
mode = "event"
cut = [
    { name = "trigger_emulation_cut", type = "event", decrements_exposure = false },
    { name = "data_quality_cut",      type = "event", decrements_exposure = true  },
]
branch = [
    { name = "trigger_within_gate",             type = "event" },
    { name = "time_of_flash_closest_to_trigger", type = "event", parameters = [ 0.0 ] },
    { name = "n_true_nu",                        type = "event" },
]

# n_true_nu (added for the Howard-style rock-muon double-counting check, see
# selection/include/event_variables.h): the raw count of GENIE-generated
# neutrinos in the event (sr.mc.nu.size()), independent of whether SPINE's
# reconstruction managed to truth-match any candidate to it. Unlike
# true_category / nu_id (used elsewhere in this toml and in the notebook),
# this does NOT require a successful reconstruction-level match -- it only
# asks whether a neutrino was generated in this event at all. For the rock
# sample this distinguishes "this trigger came from a spill where a rock
# neutrino was actually generated" from "this trigger came from a spill with
# no generated neutrino at all (purely simulated ambient cosmic)" -- the
# distinction Howard's technote (Sec. 6.8.7) uses to separate genuinely
# double-counted-with-offbeam rock/cosmic slices from ones that aren't.