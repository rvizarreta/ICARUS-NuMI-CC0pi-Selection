# PRE-SELECTION TREE
#
# crtpmt_veto added 2026-08-20: the vertex_x/y/z and flash_time data/MC
# comparison plots built from this tree showed a large discrepancy (data/MC
# ~1.17-1.26) at the plain fiducial_cut + trigger_emulation_cut +
# data_quality_cut stage. Comparing against Roy's technote
# (NuMu_CC_Inclusive_Technote, Fig. 6/7/9/10), her analogous vertex/
# kinematic comparison plots are made with fiducial volume + clear-cosmic +
# CRT-PMT spill cut, not just fiducial volume alone. crtpmt_veto
# (event_cuts.h) is added here to close that gap for THIS tree specifically.
#
# This is a deliberate, scoped exception to the standing decision recorded
# below on the `trigger_time` tree (crtpmt_veto is "Roy's cut, not Howard's,
# and conflating the two was already flagged as a mistake to avoid"): that
# decision was about keeping trigger_time's Howard-style trigger-time plot
# uncontaminated by Roy's cuts. `preselection`'s vertex/kinematic plots are
# a different context, and Roy's fuller cut chain is the relevant point of
# comparison for them specifically -- trigger_time is intentionally left
# unchanged.
#
# A true reconstruction-level "clear cosmic" slice-tag rejection (the other
# cut in Roy's/Howard's baseline pre-selection, per their technotes) is NOT
# added here: no such cut is currently registered in cuts.h/event_cuts.h in
# this repo (only cuts::cosmic exists, which is a TRUTH-level cut, not the
# same thing) -- adding it would need new C++ against a StandardRecord field
# not confirmed from this checkout. Owner/next step TBD.
[[tree]]
name = "preselection"
sim_only = false
add_systematics = false
add_exposure = true
mode = "reco"
cut = [
    { name = "fiducial_cut",          type = "reco" },
    { name = "trigger_emulation_cut", type = "event", decrements_exposure = false },
    { name = "data_quality_cut",      type = "event", decrements_exposure = true  },
    #{ name = "crtpmt_veto",           type = "event", parameters = [ "@flash_low_t", "@flash_high_t" ] },
]
branch = [
    # Interaction-level
    { name = "is_nu",              type = "both"    },
    { name = "is_data",            type = "both"    },
    { name = "category",           type = "true"    },
    { name = "nuisance_is_signal", type = "mctruth" },
    { name = "interaction_mode",   type = "mctruth" },
    { name = "cut_type",           type = "both"    },
    { name = "vertex_x",           type = "both"    },
    { name = "vertex_y",           type = "both"    },
    { name = "vertex_z",           type = "both"    },
    { name = "fiducial",           type = "reco"    },
    { name = "neutrino_energy",    type = "mctruth" },
    { name = "pdg",                type = "mctruth" },
    { name = "parent_pdg",         type = "mctruth" },

    # Longest track direction/length (rock-vs-cosmic angular separation,
    # Cos(theta_LTYD) -- see the rock-angular-separation notebook cell).
    # Re-added 2026-08-20: this block was dropped when crtpmt_veto was
    # added above; without it, events/rock/preselection has no
    # reco_longest_track_* columns and the notebook's rock angular cut
    # fails with a KeyInFileError. Needs a rebuild to take effect.
    { name = "start_dir_x", type = "both_particle", selector = "longest_track" },
    { name = "start_dir_y", type = "both_particle", selector = "longest_track" },
    { name = "start_dir_z", type = "both_particle", selector = "longest_track" },
    { name = "length",      type = "both_particle", selector = "longest_track" },

    # Flash variables (as branches, not cuts)
    { name = "flash_time",         type = "reco"    },
    { name = "flash_total_pe",     type = "reco"    },
    { name = "flash_hypothesis",   type = "reco"    },

    # Selection cuts as branch variables
    { name = "flash_cut",            type = "reco", parameters = [ "@flash_low_t", "@flash_high_t" ] },
    { name = "no_photons",           type = "reco", parameters = [ "@photon_threshold"   ] },
    { name = "no_electrons",         type = "reco", parameters = [ "@electron_threshold" ] },
    { name = "single_muon",          type = "reco", parameters = [ "@muon_threshold"     ] },
    { name = "no_charged_pions",     type = "reco", parameters = [ "@pion_threshold"     ] },
    { name = "no_protons",           type = "reco", parameters = [ "@proton_threshold"   ] },
    { name = "photon_multiplicity",  type = "reco", parameters = [ "@photon_threshold"   ] },
    { name = "electron_multiplicity",type = "reco", parameters = [ "@electron_threshold" ] },
    { name = "muon_multiplicity",    type = "reco", parameters = [ "@muon_threshold"     ] },
    { name = "pion_multiplicity",    type = "reco", parameters = [ "@pion_threshold"     ] },
    { name = "proton_multiplicity",  type = "reco", parameters = [ "@proton_threshold"   ] },

    # Leading MUON softmax scores and kinematics
    { name = "momentum",          type = "both_particle", selector = "leading_muon"},
    { name = "muon_softmax",      type = "reco_particle", selector = "leading_muon" },
    { name = "proton_softmax",    type = "reco_particle", selector = "leading_muon" },
    { name = "pion_softmax",      type = "reco_particle", selector = "leading_muon" },
    { name = "photon_softmax",    type = "reco_particle", selector = "leading_muon" },
    { name = "electron_softmax",  type = "reco_particle", selector = "leading_muon" },
    { name = "primary_softmax",   type = "reco_particle", selector = "leading_muon" },
    { name = "secondary_softmax", type = "reco_particle", selector = "leading_muon" },
    { name = "length",            type = "reco_particle", selector = "leading_muon" },
    { name = "ke",                type = "reco_particle", selector = "leading_muon" },
    { name = "containment",       type = "reco_particle", selector = "leading_muon" },
    { name = "pid",               type = "reco_particle", selector = "leading_muon" },

    # Leading PROTON softmax scores and kinematics
    { name = "muon_softmax",      type = "reco_particle", selector = "leading_proton" },
    { name = "proton_softmax",    type = "reco_particle", selector = "leading_proton" },
    { name = "pion_softmax",      type = "reco_particle", selector = "leading_proton" },
    { name = "photon_softmax",    type = "reco_particle", selector = "leading_proton" },
    { name = "electron_softmax",  type = "reco_particle", selector = "leading_proton" },
    { name = "primary_softmax",   type = "reco_particle", selector = "leading_proton" },
    { name = "secondary_softmax", type = "reco_particle", selector = "leading_proton" },
    { name = "length",            type = "reco_particle", selector = "leading_proton" },
    { name = "ke",                type = "reco_particle", selector = "leading_proton" },
    { name = "containment",       type = "reco_particle", selector = "leading_proton" },
    { name = "pid",               type = "reco_particle", selector = "leading_proton" },

    # Leading PION softmax scores and kinematics
    { name = "muon_softmax",      type = "reco_particle", selector = "leading_pion" },
    { name = "proton_softmax",    type = "reco_particle", selector = "leading_pion" },
    { name = "pion_softmax",      type = "reco_particle", selector = "leading_pion" },
    { name = "photon_softmax",    type = "reco_particle", selector = "leading_pion" },
    { name = "electron_softmax",  type = "reco_particle", selector = "leading_pion" },
    { name = "primary_softmax",   type = "reco_particle", selector = "leading_pion" },
    { name = "secondary_softmax", type = "reco_particle", selector = "leading_pion" },
    { name = "length",            type = "reco_particle", selector = "leading_pion" },
    { name = "ke",                type = "reco_particle", selector = "leading_pion" },
    { name = "containment",       type = "reco_particle", selector = "leading_pion" },
    { name = "pid",               type = "reco_particle", selector = "leading_pion" },

    # Leading ELECTRON softmax scores and kinematics
    { name = "muon_softmax",      type = "reco_particle", selector = "leading_electron" },
    { name = "proton_softmax",    type = "reco_particle", selector = "leading_electron" },
    { name = "pion_softmax",      type = "reco_particle", selector = "leading_electron" },
    { name = "photon_softmax",    type = "reco_particle", selector = "leading_electron" },
    { name = "electron_softmax",  type = "reco_particle", selector = "leading_electron" },
