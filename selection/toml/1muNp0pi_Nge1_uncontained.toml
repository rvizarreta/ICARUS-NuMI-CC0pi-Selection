# PRE-SELECTION TREE
[[tree]]
name = "preselection"
sim_only = false
add_systematics = false
add_exposure = true
mode = "reco"
cut = [
    { name = "fiducial_cut",          type = "reco" },
    { name = "trigger_emulation_cut", type = "event", decrements_exposure = false },
    { name = "data_quality_cut",      type = "event", decrements_exposure = true  },
]
branch = [
    # Interaction-level
    { name = "is_nu",              type = "both"    },
    { name = "is_data",            type = "both"    },
    { name = "category",           type = "true"    },
    { name = "nuisance_is_signal", type = "mctruth" },
    { name = "interaction_mode",   type = "mctruth" },
    { name = "cut_type",           type = "both"    },
    { name = "vertex_x",           type = "both"    },
    { name = "vertex_y",           type = "both"    },
    { name = "vertex_z",           type = "both"    },
    { name = "fiducial",           type = "reco"    },
    { name = "neutrino_energy",    type = "mctruth" },

    # Flash variables (as branches, not cuts)
    { name = "flash_time",         type = "reco"    },
    { name = "flash_total_pe",     type = "reco"    },
    { name = "flash_hypothesis",   type = "reco"    },

    # Selection cuts as branch variables
    { name = "flash_cut",            type = "reco", parameters = [ "@flash_low_t", "@flash_high_t" ] },
    { name = "no_photons",           type = "reco", parameters = [ "@photon_threshold"   ] },
    { name = "no_electrons",         type = "reco", parameters = [ "@electron_threshold" ] },
    { name = "single_muon",          type = "reco", parameters = [ "@muon_threshold"     ] },
    { name = "no_charged_pions",     type = "reco", parameters = [ "@pion_threshold"     ] },
    { name = "no_protons",           type = "reco", parameters = [ "@proton_threshold"   ] },
    { name = "photon_multiplicity",  type = "reco", parameters = [ "@photon_threshold"   ] },
    { name = "electron_multiplicity",type = "reco", parameters = [ "@electron_threshold" ] },
    { name = "muon_multiplicity",    type = "reco", parameters = [ "@muon_threshold"     ] },
    { name = "pion_multiplicity",    type = "reco", parameters = [ "@pion_threshold"     ] },
    { name = "proton_multiplicity",  type = "reco", parameters = [ "@proton_threshold"   ] },

    # Leading MUON softmax scores and kinematics
    { name = "muon_softmax",      type = "reco_particle", selector = "leading_muon" },
    { name = "proton_softmax",    type = "reco_particle", selector = "leading_muon" },
    { name = "pion_softmax",      type = "reco_particle", selector = "leading_muon" },
    { name = "photon_softmax",    type = "reco_particle", selector = "leading_muon" },
    { name = "electron_softmax",  type = "reco_particle", selector = "leading_muon" },
    { name = "primary_softmax",   type = "reco_particle", selector = "leading_muon" },
    { name = "secondary_softmax", type = "reco_particle", selector = "leading_muon" },
    { name = "length",            type = "reco_particle", selector = "leading_muon" },
    { name = "ke",                type = "reco_particle", selector = "leading_muon" },
    { name = "containment",       type = "reco_particle", selector = "leading_muon" },
    { name = "pid",               type = "reco_particle", selector = "leading_muon" },

    # Leading PROTON softmax scores and kinematics
    { name = "muon_softmax",      type = "reco_particle", selector = "leading_proton" },
    { name = "proton_softmax",    type = "reco_particle", selector = "leading_proton" },
    { name = "pion_softmax",      type = "reco_particle", selector = "leading_proton" },
    { name = "photon_softmax",    type = "reco_particle", selector = "leading_proton" },
    { name = "electron_softmax",  type = "reco_particle", selector = "leading_proton" },
    { name = "primary_softmax",   type = "reco_particle", selector = "leading_proton" },
    { name = "secondary_softmax", type = "reco_particle", selector = "leading_proton" },
    { name = "length",            type = "reco_particle", selector = "leading_proton" },
    { name = "ke",                type = "reco_particle", selector = "leading_proton" },
    { name = "containment",       type = "reco_particle", selector = "leading_proton" },
    { name = "pid",               type = "reco_particle", selector = "leading_proton" },

    # Leading PION softmax scores and kinematics
    { name = "muon_softmax",      type = "reco_particle", selector = "leading_pion" },
    { name = "proton_softmax",    type = "reco_particle", selector = "leading_pion" },
    { name = "pion_softmax",      type = "reco_particle", selector = "leading_pion" },
    { name = "photon_softmax",    type = "reco_particle", selector = "leading_pion" },
    { name = "electron_softmax",  type = "reco_particle", selector = "leading_pion" },
    { name = "primary_softmax",   type = "reco_particle", selector = "leading_pion" },
    { name = "secondary_softmax", type = "reco_particle", selector = "leading_pion" },
    { name = "length",            type = "reco_particle", selector = "leading_pion" },
    { name = "ke",                type = "reco_particle", selector = "leading_pion" },
    { name = "containment",       type = "reco_particle", selector = "leading_pion" },
    { name = "pid",               type = "reco_particle", selector = "leading_pion" },

    # Leading ELECTRON softmax scores and kinematics
    { name = "muon_softmax",      type = "reco_particle", selector = "leading_electron" },
    { name = "proton_softmax",    type = "reco_particle", selector = "leading_electron" },
    { name = "pion_softmax",      type = "reco_particle", selector = "leading_electron" },
    { name = "photon_softmax",    type = "reco_particle", selector = "leading_electron" },
    { name = "electron_softmax",  type = "reco_particle", selector = "leading_electron" },
    { name = "primary_softmax",   type = "reco_particle", selector = "leading_electron" },
    { name = "secondary_softmax", type = "reco_particle", selector = "leading_electron" },
    { name = "length",            type = "reco_particle", selector = "leading_electron" },
    { name = "ke",                type = "reco_particle", selector = "leading_electron" },
    { name = "containment",       type = "reco_particle", selector = "leading_electron" },
    { name = "pid",               type = "reco_particle", selector = "leading_electron" },

    # Leading PHOTON softmax scores and kinematics
    { name = "muon_softmax",      type = "reco_particle", selector = "leading_photon" },
    { name = "proton_softmax",    type = "reco_particle", selector = "leading_photon" },
    { name = "pion_softmax",      type = "reco_particle", selector = "leading_photon" },
    { name = "photon_softmax",    type = "reco_particle", selector = "leading_photon" },
    { name = "electron_softmax",  type = "reco_particle", selector = "leading_photon" },
    { name = "primary_softmax",   type = "reco_particle", selector = "leading_photon" },
    { name = "secondary_softmax", type = "reco_particle", selector = "leading_photon" },
    { name = "length",            type = "reco_particle", selector = "leading_photon" },
    { name = "ke",                type = "reco_particle", selector = "leading_photon" },
    { name = "containment",       type = "reco_particle", selector = "leading_photon" },
    { name = "pid",               type = "reco_particle", selector = "leading_photon" },
]

# SELECTION TREE
[[tree]]
name = "selected"
sim_only = false
add_systematics = true
add_exposure = true
mode = "reco"
cut = [
    { name = "fiducial_cut",              type = "reco" },
    { name = "flash_cut",                 type = "reco",  parameters = [ "@flash_low_t", "@flash_high_t" ] },
    { name = "no_photons",                type = "reco",  parameters = [ "@photon_threshold"             ] },
    { name = "no_electrons",              type = "reco",  parameters = [ "@electron_threshold"           ] },
    { name = "single_muon",               type = "reco",  parameters = [ "@muon_threshold"               ] },
    { name = "no_charged_pions",          type = "reco",  parameters = [ "@pion_threshold"               ] },
    { name = "!no_protons",               type = "reco",  parameters = [ "@proton_threshold"             ] },
    { name = "trigger_emulation_cut",     type = "event", decrements_exposure = false },
    { name = "data_quality_cut",          type = "event", decrements_exposure = true  },
]
branch = [
    # Interaction-level truth/reco branches
    { name = "is_nu",                   type = "both"   },
    { name = "is_data",                 type = "both"   },
    { name = "cut_type",                type = "both"   },
    { name = "neutrino_id",             type = "true"    },
    { name = "baseline",                type = "mctruth" },
    { name = "containment_cut",         type = "both"    },
    { name = "cc",                      type = "mctruth" },
    { name = "pdg",                     type = "mctruth" },     # Needed for NuMI Flux calculation
    { name = "parent_pdg",              type = "mctruth" },     # Needed for NuMI Flux calculation
    { name = "interaction_type",        type = "mctruth" },
    { name = "interaction_mode",        type = "mctruth" },
    { name = "category",                type = "true"    },
    { name = "neutrino_energy",         type = "mctruth" },     # Needed for NuMI Flux calculation
    { name = "visible_energy",          type = "both"    },
    { name = "visible_energy_calosub",  type = "both"    },
    { name = "photon_multiplicity",     type = "reco", parameters = [ "@photon_threshold"   ]},
    { name = "electron_multiplicity",   type = "reco", parameters = [ "@electron_threshold" ]},
    { name = "muon_multiplicity",       type = "reco", parameters = [ "@muon_threshold"     ]},
    { name = "pion_multiplicity",       type = "reco", parameters = [ "@pion_threshold"     ]},
    { name = "proton_multiplicity",     type = "reco", parameters = [ "@proton_threshold"   ]},
    { name = "no_charged_pions",        type = "true", parameters = [ "@pion_threshold"     ]},
    { name = "nuisance_is_signal",      type = "mctruth" },
    { name = "low_q2_weight",           type = "true"    },

    # Kinematic imbalance & angles
    { name = "opening_angle_deg", type = "both" },
    { name = "opening_angle_cos", type = "both" },
    { name = "dpT",               type = "both" },
    { name = "dpT_lp",            type = "both" },
    { name = "dphiT_deg",         type = "both" },
    { name = "dalphaT_deg",       type = "both" },
    { name = "dphiT",             type = "both" },
    { name = "dalphaT",           type = "both" },
    { name = "dpL",               type = "both" },
    { name = "dpL_lp",            type = "both" },
    { name = "pn",                type = "both" },
    { name = "pn_lp",             type = "both" },
    { name = "dpT_lp_genie",      type = "mctruth" },

    # Fundamental kinematic variables
    { name = "Q2",            type = "both" },
    { name = "W",             type = "both" },

    # Leading MUON particle-level
    {name = "momentum",           type = "both_particle", selector = "leading_muon"},
    {name = "mass",               type = "both_particle", selector = "leading_muon"},
    {name = "csda_ke",            type = "both_particle", selector = "leading_muon"},
    {name = "containment",        type = "both_particle", selector = "leading_muon"},
    {name = "mcs_ke",             type = "both_particle", selector = "leading_muon"},
    {name = "energy",             type = "both_particle", selector = "leading_muon"},
    {name = "length",             type = "both_particle", selector = "leading_muon"},
    {name = "dpT",                type = "both_particle", selector = "leading_muon"},
    { name = "end_x",             type = "both_particle", selector = "leading_muon" },
    { name = "end_y",             type = "both_particle", selector = "leading_muon" },
    { name = "end_z",             type = "both_particle", selector = "leading_muon" },
    { name = "ke",                type = "both_particle", selector = "leading_muon" },
    { name = "length",            type = "both_particle", selector = "leading_muon" },
    { name = "polar_angle",       type = "both_particle", selector = "leading_muon" },
    { name = "polar_angle_cos",   type = "both_particle", selector = "leading_muon" },
    { name = "azimuthal_angle",   type = "both_particle", selector = "leading_muon" },
    { name = "cos_theta_mu",      type = "both_particle", selector = "leading_muon" },
    { name = "px",                type = "both_particle", selector = "leading_muon" },
    { name = "py",                type = "both_particle", selector = "leading_muon" },
    { name = "pz",                type = "both_particle", selector = "leading_muon" },

    # Leading PROTON particle-level
    { name = "momentum",           type = "both_particle", selector = "leading_proton"},
    { name = "mass",               type = "both_particle", selector = "leading_proton"},
    { name = "csda_ke",            type = "both_particle", selector = "leading_proton"},
    { name = "containment",        type = "both_particle", selector = "leading_proton"},
    { name = "mcs_ke",             type = "both_particle", selector = "leading_proton"},
    { name = "energy",             type = "both_particle", selector = "leading_proton"},
    { name = "length",             type = "both_particle", selector = "leading_proton"},
    { name = "px",                 type = "both_particle", selector = "leading_proton" },
    { name = "py",                 type = "both_particle", selector = "leading_proton" },
    { name = "pz",                 type = "both_particle", selector = "leading_proton" },

    # Leading PION particle-level
    { name = "momentum",           type = "both_particle", selector = "leading_pion"},
    { name = "ke",                 type = "both_particle", selector = "leading_pion" },
    { name = "length",             type = "both_particle", selector = "leading_pion" },
    { name = "containment",        type = "both_particle", selector = "leading_pion"},
    { name = "energy",             type = "both_particle", selector = "leading_pion"},
    { name = "px",                 type = "both_particle", selector = "leading_pion" },
    { name = "py",                 type = "both_particle", selector = "leading_pion" },
    { name = "pz",                 type = "both_particle", selector = "leading_pion" },

    # PID and PDG for leading particles
    { name = "pid", type = "both_particle", selector = "leading_muon"   },
    { name = "pid", type = "both_particle", selector = "leading_proton" },
    { name = "pid", type = "both_particle", selector = "leading_pion"   },
    { name = "pdg_code", type = "both_particle", selector = "leading_muon"     },
    { name = "pdg_code", type = "both_particle", selector = "leading_proton"   },
    { name = "pdg_code", type = "both_particle", selector = "leading_pion"     },
