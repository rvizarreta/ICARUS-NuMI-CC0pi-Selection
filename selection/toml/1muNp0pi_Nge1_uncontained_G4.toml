[general]
output = "/exp/icarus/data/users/rvizarr/medulla/1muNp0pi_Nge1_uncontained_G4"
primfn = "default_primary_classification"
pidfn = "default_pid"

[parameters]
photon_threshold = 10.0
electron_threshold = 25.0
muon_threshold = 143.425
pion_threshold = 25.0
proton_threshold = 50.0
muon_mcs_ke_max = 4000.0
flash_low_t = 0.0
flash_high_t = 9.6
QE_parameter = 0.0
MEC_parameter = 10.0

[[category]] # 0 : Signal, QE
cuts = [
    { name = "neutrino"        },
    { name = "is_interaction_mode",     parameters = [ "@QE_parameter"       ] },
    { name = "fiducial_cut"    },
    { name = "no_charged_pions",        parameters = [ "@pion_threshold"     ] },
    { name = "single_muon",             parameters = [ "@muon_threshold"     ] },
    { name = "!no_protons",             parameters = [ "@proton_threshold"   ] },
    { name = "no_neutral_pions",            type = "mctruth"                   },
    { name = "no_extra_particles_minerva",  type = "mctruth"                   },
]

[[category]] # 1 : Signal, MEC (2p2h)
cuts = [
    { name = "neutrino"        },
    { name = "is_interaction_mode",     parameters = [ "@MEC_parameter"      ] },
    { name = "fiducial_cut"    },
    { name = "no_charged_pions",        parameters = [ "@pion_threshold"     ] },
    { name = "single_muon",             parameters = [ "@muon_threshold"     ] },
    { name = "!no_protons",             parameters = [ "@proton_threshold"   ] },
    { name = "no_neutral_pions",            type = "mctruth"                   },
    { name = "no_extra_particles_minerva",  type = "mctruth"                   },
]

[[category]] # 2 : Signal, pion absorption (RES/DIS/other; catches signal not matched by 0 or 1)
cuts = [
    { name = "neutrino"        },
    { name = "fiducial_cut"    },
    { name = "no_charged_pions",        parameters = [ "@pion_threshold"     ] },
    { name = "single_muon",             parameters = [ "@muon_threshold"     ] },
    { name = "!no_protons",             parameters = [ "@proton_threshold"   ] },
    { name = "no_neutral_pions",            type = "mctruth"                   },
    { name = "no_extra_particles_minerva",  type = "mctruth"                   },
]

[[category]] # 3 : OOFV (signal-like, no fiducial requirement)
cuts = [
    { name = "neutrino" },
    { name = "no_charged_pions", parameters = [ "@pion_threshold"     ] },
    { name = "single_muon",      parameters = [ "@muon_threshold"     ] },
    { name = "!no_protons",      parameters = [ "@proton_threshold"   ] },
    { name = "no_neutral_pions",            type = "mctruth"            },
    { name = "no_extra_particles_minerva",  type = "mctruth"            },
]

[[category]] # 4 : numuCC Np1pi± (exactly one charged pion above threshold)
cuts = [
    { name = "neutrino"    },
    { name = "iscc"        },
    { name = "single_pion", parameters = [ "@pion_threshold" ] },
]

[[category]] # 5 : Uncontained muon, fiducial
cuts = [
    { name = "neutrino"        },
    { name = "fiducial_cut"    },
    { name = "single_muon",             parameters = [ "@muon_threshold" ] },
]

[[category]] # 6 : Uncontained muon
cuts = [
    { name = "neutrino" },
    { name = "single_muon", parameters = [ "@muon_threshold" ] },
]

[[category]] # 7 : Neutrino, charged current
cuts = [
    { name = "neutrino" },
    { name = "iscc"     },
]

[[category]] # 8 : Neutrino, neutral current
cuts = [
    { name = "neutrino" },
    { name = "!iscc"    },
]

[[category]] # 9 : Cosmic
cuts = [
    { name = "!neutrino" },
]

# SIMULATION ONLY
[[sample]]
name = "nominal"
path = "/pnfs/icarus/persistent/users/kyjung/G4Reweight/NuMI/icaruspro_production_v09_89_01_02p02_2025A_NuMI_nuCos_CV_detsys_nu_cos_CV_scrub/*.flat.root"
ismc = true
disable = false

