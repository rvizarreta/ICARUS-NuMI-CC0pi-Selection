### dalphaT - Contained ------------------------------------
### Extra requirement on the contained sample: reco muon momentum below 0.8 GeV/c. It is part
### of the variable mask (a reco-level selection, so it is applied to the true_* variables as
### well, as the containment cut already is) and is quoted in the xlabel suffix, which the
### plotting code turns into the box on the plot. The contained truth and reco bins below were
### re-derived with this cut applied (2026-11-03), same procedure as dpT: finest binning with
### min f_diag >= 0.5 would be N=8 (0.506), but N=7 was kept for its margin (min/mean 0.533/0.584)
### and to match the 7 truth bins of the technote. No overflow bin (bounded variable).

