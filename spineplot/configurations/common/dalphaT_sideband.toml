# dalphaT binning for the pi+- SIDEBAND (auto-generated by
# technote/sideband_binning.py). RECO HISTOGRAMS ONLY.
#
# The signal-region criterion does not apply here. Signal binning maximises
# f_diag, the fraction of events generated in a truth bin that reconstruct in
# it - a response-matrix quantity. Sideband events are background: they have no
# template parameter and are never unfolded, so they enter the fit through b_j,
# not through R. What the sideband does is contribute a Poisson term and a
# data/MC comparison, and both want uniform occupancy.
#
# CRITERION: EQUAL-POPULATION, 24 bins, weighted by ppfx_cv_weight,
# sized at full POT 2.36124e+20 (MC POT 7.17839e+20).
# Only the plain reco_* display blocks were re-binned. The true_* and
# *_smearing blocks below are carried over from the signal-region file
# unchanged and are meaningless for this sample - do not plot them.
#
#   reco_dalphaT: 24 bins, 453 events/bin at full POT, widths 1.729 to 12.87 (ratio 7), 100.00% of the sample in range
#   reco_dalphaT_contained: NOT equal-population. Uses the same 14 reco edges as reco_dalphaT_smearing_contained,
#       so the histogram and the smearing matrix share one axis. 129 to 248 events/bin at full POT, 2333 in range (100%).
#   reco_dalphaT_exiting: 24 bins, 317 events/bin at full POT, widths 1.109 to 13.27 (ratio 12), 100.00% of the sample in range
#
# NOT re-binned, still on the uniform binning they had (no custom_bins
# in the signal-region file): reco_dalphaT_residual_contained, reco_dalphaT_residual_exiting
#
# Widths are strongly non-uniform, so these histograms MUST be drawn with
# per_bin_width = true or the shape is meaningless.
#
# ----------------------------------------------------------------------
# Below is the header of the signal-region file dalphaT.toml, from which this
# one was generated. It documents the true_* and *_smearing blocks, which are
# carried over verbatim. Its f_diag and Cramer-Rao numbers describe the
# SIGNAL reco binning and do NOT apply to the reco_* blocks in this file.
# ----------------------------------------------------------------------
[variables]

### dalphaT binning (2026-07-28). TRUTH binning: finest with min f_diag above a
### per-sample threshold in every truth bin - 0.5 contained, 0.4 combined, 0.3 exiting.
### Range [0, 180] degrees, no overflow.
### Reco binning is 2:1: each truth bin is split at the median reco value of the events
### inside it (clamped to 15-85% of the bin). This is the binning GUNDAM fits, and matches
### Howard's technote Fig. 25 (smearing matrices in the extraction binning). The square /
### uniform matrices earlier in that note are explicitly "arbitrary, uniform binning"
### placeholders and are not a precedent for 1:1. A truth column therefore spans TWO reco
### rows: the diagonal is the SUM of the two on-diagonal cells, and the f_diag values
### quoted below are those sums.
### Study: min/mean f_diag = 0.533/0.584 (contained, N=7, re-derived 2026-11-03 WITH the p_mu < 0.8 GeV/c cut), 0.300/0.450 (exiting, N=5),
### 0.455/0.577 (combined, N=4). Worst Cramer-Rao unc at 2.36124e20 POT: 8.9% / 9.0% / 3.1% (contained value is pre-cut, not recomputed).
### NOTE exiting: the three central bins sit at 30-37% diagonality - the MCS-driven angular
### resolution (68% half-width 39 deg) does not support finer structure there. The two edge
### bins are strong (63%, 65%) because migration near 0 and 180 deg is one-sided.

### dalphaT - Combined ------------------------------------

[variables.reco_dalphaT_residual]
key = "reco_dalphaT_deg"
range = [0,180]
nbins = 100
xlabel = 'Reco $\delta \alpha_T$ [degrees]'
xticks = [0, 30, 60, 90, 120, 150, 180]

[variables.true_dalphaT_residual]
key = "true_dalphaT_deg"
range = [0,180]
nbins = 100
xlabel = 'True $\delta \alpha_T$ [degrees]'
xticks = [0, 30, 60, 90, 120, 150, 180]

[variables.reco_dalphaT_smearing]
