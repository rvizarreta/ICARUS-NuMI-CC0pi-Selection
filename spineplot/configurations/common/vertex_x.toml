# --- Combined (Contained + Exiting muons) ---

[variables.reco_vertex_x]
key = "reco_vertex_x"
range = [-400, 400]
nbins = 50
xlabel = 'Reco Vertex X [cm] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.reco_vertex_x_residual]
key = "reco_vertex_x"
range = [-400, 400]
nbins = 200
xlabel = 'Reco Vertex X [cm]'

[variables.true_vertex_x_residual]
key = "true_vertex_x"
range = [-400, 400]
nbins = 200
xlabel = 'True Vertex X [cm]'

[variables.reco_vertex_x_smearing]
key = "reco_vertex_x"
range = [-400, 400]
nbins = 10
xlabel = 'Reco Vertex X [cm] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.true_vertex_x_smearing]
key = "true_vertex_x"
range = [-400, 400]
nbins = 10
xlabel = 'True Vertex X [cm] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.abs_vertex_x_residual]
key = "abs_vertex_x_residual"
range = [-20, 20]
nbins = 50
xlabel = '$x_{\mathrm{vtx,reco}} - x_{\mathrm{vtx,true}}$ [cm] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

# --- Contained muon ---

