# dphiT binning for the pi+- SIDEBAND (auto-generated by
# technote/sideband_binning.py). RECO HISTOGRAMS ONLY (combined reco axis aligned with signal).
#
# The signal-region criterion does not apply here. Signal binning maximises
# f_diag, the fraction of events generated in a truth bin that reconstruct in
# it - a response-matrix quantity. Sideband events are background: they have no
# template parameter and are never unfolded, so they enter the fit through b_j,
# not through R. What the sideband does is contribute a Poisson term and a
# data/MC comparison, and both want uniform occupancy.
#
# CRITERION: reco_dphiT (combined) uses the 30 reco edges of the signal smearing matrix.
# reco_dphiT_contained and reco_dphiT_exiting stay equal-population, 24 bins,
# weighted by ppfx_cv_weight, sized at full POT 2.36124e+20 (MC POT 7.17839e+20).
# The true_* and *_smearing blocks below are copied from the signal-region file
# and are diagnostics for this sample.
#
#   reco_dphiT: 30 bins, same edges as the signal-region combined reco axis and reco_dphiT_smearing (no p_mu cut).
#   reco_dphiT_contained: 24 bins, 136 events/bin at full POT, widths 2.375 to 19.13 (ratio 8), 100.00% of the sample in range
#   reco_dphiT_exiting: 24 bins, 317 events/bin at full POT, widths 1.807 to 26.39 (ratio 15), 100.00% of the sample in range
#
# NOT re-binned, still on the uniform binning they had (no custom_bins
# in the signal-region file): reco_dphiT_residual_contained, reco_dphiT_residual_exiting
#
# Widths are strongly non-uniform, so these histograms MUST be drawn with
# per_bin_width = true or the shape is meaningless.
#
# ----------------------------------------------------------------------
# Below is the header of the signal-region file dphiT.toml, from which this
# one was generated. It documents the true_* and *_smearing blocks, which are
# carried over verbatim. Its f_diag and Cramer-Rao numbers describe the
# SIGNAL reco binning and do NOT apply to the reco_* blocks in this file.
# ----------------------------------------------------------------------
### dphiT binning (2026-11-03). CROSS-SECTION VARIABLE, COMBINED (contained + exiting) SAMPLE ONLY.
### Only the combined blocks (true_dphiT, reco_dphiT, *_smearing) are binned for the
### cross section. The contained and exiting blocks below are display-only
### (equal-population, 24 bins) and are NOT tied to the response matrix.
###
### CRITERION: f_diag. Truth bins are the finest set whose worst-bin f_diag stays
### above 0.40 (same threshold used for the combined sample in dpT and dalphaT).
### f_diag is the fraction of events generated in a truth bin that are reconstructed
### in the same bin range. Each truth bin is split into two reco bins (2:1 nesting),
### so the diagonal of the smearing matrix is the sum of two reco rows.
### Procedure: technote/binning_walkthrough.py, signal events only, ppfx_cv_weight,
### 1 degree grid, no p_mu cut (combined sample).
###
### RESULT: 15 truth bins, 30 reco bins over [0, 180] degrees.
###   truth: [0.0, 5.0, 10.0, 16.0, 23.0, 31.0, 40.0, 50.0, 61.0, 73.0, 85.0, 98.0, 113.0, 129.0, 146.0, 180.0]
###   reco : [0.0, 2.4, 5.0, 7.4, 10.0, 12.8, 16.0, 19.2, 23.0, 26.7, 31.0, 35.1, 40.0, 44.6, 50.0, 55.2, 61.0, 66.5, 73.0, 78.4, 85.0, 90.9, 98.0, 105.2, 113.0, 120.7, 129.0, 136.8, 146.0, 162.3, 180.0]
###   worst-bin f_diag = 0.414  (N=15 is where the sweep stops: its bin-width
###   parameter m reaches 1 degree, the grid step. Finer binning was not tested.)
### delta phi_T is bounded in [0, 180], so there is no overflow bin. The last truth
### bin [146, 180] is 34 degrees wide (f_diag 0.709); the procedure gives wide bins
### where the events are few.
###
### Bin widths span 5-34 degrees, so histograms MUST be drawn with per_bin_width = true.

### dphiT - Combined ------------------------------------

[variables.reco_dphiT_residual]
key = "reco_dphiT_deg"
range = [0,180]
nbins = 100
xlabel = 'Reco $\delta \phi_T$ [degrees]'

[variables.true_dphiT_residual]
key = "true_dphiT_deg"
range = [0,180]
nbins = 100
xlabel = 'True $\delta \phi_T$ [degrees]'

[variables.reco_dphiT_smearing]
key = "reco_dphiT_deg"
range = [0,180]
nbins = 30
binning_scheme = 'custom_bins'
custom_bins = [0.0, 2.4, 5.0, 7.4, 10.0, 12.8, 16.0, 19.2, 23.0, 26.7, 31.0, 35.1, 40.0, 44.6, 50.0, 55.2, 61.0, 66.5, 73.0, 78.4, 85.0, 90.9, 98.0, 105.2, 113.0, 120.7, 129.0, 136.8, 146.0, 162.3, 180.0]
