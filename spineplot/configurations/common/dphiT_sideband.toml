# dphiT binning for the pi+- SIDEBAND (auto-generated by
# technote/sideband_binning.py). RECO HISTOGRAMS ONLY.
#
# The signal-region criterion does not apply here. Signal binning maximises
# f_diag, the fraction of events generated in a truth bin that reconstruct in
# it - a response-matrix quantity. Sideband events are background: they have no
# template parameter and are never unfolded, so they enter the fit through b_j,
# not through R. What the sideband does is contribute a Poisson term and a
# data/MC comparison, and both want uniform occupancy.
#
# CRITERION: EQUAL-POPULATION, 24 bins, weighted by ppfx_cv_weight,
# sized at full POT 2.36124e+20 (MC POT 7.17839e+20).
# Only the plain reco_* display blocks were re-binned. The true_* and
# *_smearing blocks below are carried over from the signal-region file
# unchanged and are meaningless for this sample - do not plot them.
#
#   reco_dphiT: 24 bins, 453 events/bin at full POT, widths 1.972 to 23.55 (ratio 12), 100.00% of the sample in range
#   reco_dphiT_contained: 24 bins, 136 events/bin at full POT, widths 2.375 to 19.13 (ratio 8), 100.00% of the sample in range
#   reco_dphiT_exiting: 24 bins, 317 events/bin at full POT, widths 1.807 to 26.39 (ratio 15), 100.00% of the sample in range
#
# NOT re-binned, still on the uniform binning they had (no custom_bins
# in the signal-region file): reco_dphiT_residual_contained, reco_dphiT_residual_exiting
#
# Widths are strongly non-uniform, so these histograms MUST be drawn with
# per_bin_width = true or the shape is meaningless.
#
# ----------------------------------------------------------------------
# Below is the header of the signal-region file dphiT.toml, from which this
# one was generated. It documents the true_* and *_smearing blocks, which are
# carried over verbatim. Its f_diag and Cramer-Rao numbers describe the
# SIGNAL reco binning and do NOT apply to the reco_* blocks in this file.
# ----------------------------------------------------------------------
### dphiT binning (2026-07-31). RECO HISTOGRAMS ONLY - no cross section is
### extracted in this variable, so the smearing variables below are left untouched
### and are diagnostics only.
###
### CRITERION: EQUAL-POPULATION, 24 bins over [0, 180] degrees - edges placed so each
### bin holds a similar PREDICTED event count at the full-dataset exposure 2.36124e20.
### dphiT falls steeply (15.3% of events in the first 5 degrees, 0.5% in the last 5),
### so uniform bins put almost all the statistical power in the first two bins and
### leave the tail noisy. Equal-population flattens that: every bin carries the same
### Poisson weight, so the Data/MC ratio panel has uniform error bars across the axis
### and chi2 is not dominated by the peak.
###
### N=24 is the cap adopted for readability, not a statistical limit: every bin holds
### >= 380 events at full POT in the sparsest sample (contained), i.e. <= 5% Poisson,
### far inside the ~23% systematic band. At the 10% exposure currently plotted the
### per-bin counts are 128 (combined), 38 (contained), 90 (exiting).
###
### Bin widths span 1.3-39 degrees (combined), so these histograms MUST be drawn with
### per_bin_width = true or the shape is meaningless.

### dphiT - Combined ------------------------------------

[variables.reco_dphiT_residual]
key = "reco_dphiT_deg"
range = [0,180]
nbins = 100
xlabel = 'Reco $\delta \phi_T$ [degrees]'

[variables.true_dphiT_residual]
key = "true_dphiT_deg"
range = [0,180]
nbins = 100
xlabel = 'True $\delta \phi_T$ [degrees]'

[variables.reco_dphiT_smearing]
key = "reco_dphiT_deg"
