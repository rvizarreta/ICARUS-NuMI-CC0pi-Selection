# opening_angle binning for the pi+- SIDEBAND (auto-generated by
# technote/sideband_binning.py). RECO HISTOGRAMS ONLY.
#
# The signal-region criterion does not apply here. Signal binning maximises
# f_diag, the fraction of events generated in a truth bin that reconstruct in
# it - a response-matrix quantity. Sideband events are background: they have no
# template parameter and are never unfolded, so they enter the fit through b_j,
# not through R. What the sideband does is contribute a Poisson term and a
# data/MC comparison, and both want uniform occupancy.
#
# CRITERION: EQUAL-POPULATION, 24 bins, weighted by ppfx_cv_weight,
# sized at full POT 2.36124e+20 (MC POT 7.17839e+20).
# Only the plain reco_* display blocks were re-binned. The true_* and
# *_smearing blocks below are carried over from the signal-region file
# unchanged and are meaningless for this sample - do not plot them.
#
#   reco_opening_angle: 24 bins, 453 events/bin at full POT, widths 0.0457 to 0.2629 (ratio 6), 100.00% of the sample in range
#   reco_opening_angle_contained: 24 bins, 136 events/bin at full POT, widths 0.0516 to 0.2012 (ratio 4), 100.00% of the sample in range
#   reco_opening_angle_exiting: 24 bins, 317 events/bin at full POT, widths 0.0433 to 0.3031 (ratio 7), 100.00% of the sample in range
#
# NOT re-binned, still on the uniform binning they had (no custom_bins
# in the signal-region file): reco_opening_angle_residual_contained, reco_opening_angle_residual_exiting
#
# Widths are strongly non-uniform, so these histograms MUST be drawn with
# per_bin_width = true or the shape is meaningless.
#
# ----------------------------------------------------------------------
# Below is the header of the signal-region file opening_angle.toml, from which this
# one was generated. It documents the true_* and *_smearing blocks, which are
# carried over verbatim. Its f_diag and Cramer-Rao numbers describe the
# SIGNAL reco binning and do NOT apply to the reco_* blocks in this file.
# ----------------------------------------------------------------------
# cos(theta_mu_p) binning (2026-07-28). TRUTH binning: finest with min f_diag >= 0.7
# in every truth bin, over [-1, 1].
# Reco binning is 2:1: each truth bin is split at the median reco value of the events
# inside it (clamped to 15-85% of the bin). This is the binning GUNDAM fits, and matches
# Howard's technote Fig. 25 (smearing matrices in the extraction binning). The square /
# uniform matrices earlier in that note are explicitly "arbitrary, uniform binning"
# placeholders and are not a precedent for 1:1. A truth column therefore spans TWO reco
# rows: the diagonal is the SUM of the two on-diagonal cells, and the f_diag values
# quoted below are those sums.
#
# Note on the threshold: cos(theta_mu_p) is measured far better than the TKI variables
# (68% half-width 0.060 contained, 0.049 exiting, on an axis spanning 2.0 - about 35
# resolution elements). Diagonality therefore does not limit this variable the way it
# limits dpT and dalphaT: the 0.5/0.4/0.3 thresholds used there would admit 22/34/33 bins.
# The threshold is raised to 0.7 so the bin count is set by what the measurement needs
# rather than by what the resolution barely tolerates; this also reproduces the
# granularity of the previous configuration (10 bins).
#
# Study: min/mean f_diag = 0.706/0.733 (contained, N=10), 0.703/0.727 (exiting, N=11),
# 0.701/0.722 (combined, N=11). Worst Cramer-Rao unc at 2.36124e20 POT: 7.7% / 8.4% / 5.8%.

# --- Combined (Contained + Exiting muons) ---

[variables.reco_opening_angle]
key = "reco_opening_angle_cos"
range = [-1, 1]
nbins = 24
binning_scheme = 'custom_bins'
custom_bins = [-1.0, -0.7371, -0.5175, -0.35, -0.2052, -0.0865, 0.0084, 0.0912, 0.1677, 0.236, 0.2984, 0.3545, 0.4074, 0.4589, 0.5092, 0.557, 0.6027, 0.6513, 0.698, 0.7452, 0.7921, 0.8405, 0.8898, 0.941, 1.0]
xlabel = 'Reco $\cos(\theta_{\mu p})$ (Contained + Exiting $\mu^\pm$)'
