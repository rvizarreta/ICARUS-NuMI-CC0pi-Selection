# leading_muon_polar_angle binning for the pi+- SIDEBAND (auto-generated by
# technote/sideband_binning.py). RECO HISTOGRAMS ONLY.
#
# The signal-region criterion does not apply here. Signal binning maximises
# f_diag, the fraction of events generated in a truth bin that reconstruct in
# it - a response-matrix quantity. Sideband events are background: they have no
# template parameter and are never unfolded, so they enter the fit through b_j,
# not through R. What the sideband does is contribute a Poisson term and a
# data/MC comparison, and both want uniform occupancy.
#
# CRITERION: EQUAL-POPULATION, 24 bins, weighted by ppfx_cv_weight,
# sized at full POT 2.36124e+20 (MC POT 7.17839e+20).
# Only the plain reco_* display blocks were re-binned. The true_* and
# *_smearing blocks below are carried over from the signal-region file
# unchanged and are meaningless for this sample - do not plot them.
#
#   reco_leading_muon_polar_angle: 24 bins, 453 events/bin at full POT, widths 0.0138 to 0.719 (ratio 52), 100.00% of the sample in range
#   reco_leading_muon_polar_angle_contained: 24 bins, 136 events/bin at full POT, widths 0.0074 to 0.43 (ratio 58), 100.00% of the sample in range
#   reco_leading_muon_polar_angle_exiting: 24 bins, 317 events/bin at full POT, widths 0.0151 to 0.9388 (ratio 62), 100.00% of the sample in range
#
# NOT re-binned, still on the uniform binning they had (no custom_bins
# in the signal-region file): reco_leading_muon_polar_angle_residual_contained, reco_leading_muon_polar_angle_residual_exiting
#
# Widths are strongly non-uniform, so these histograms MUST be drawn with
# per_bin_width = true or the shape is meaningless.
#
# ----------------------------------------------------------------------
# Below is the header of the signal-region file leading_muon_polar_angle.toml, from which this
# one was generated. It documents the true_* and *_smearing blocks, which are
# carried over verbatim. Its f_diag and Cramer-Rao numbers describe the
# SIGNAL reco binning and do NOT apply to the reco_* blocks in this file.
# ----------------------------------------------------------------------
# cos(theta_mu) polar-angle binning (2026-07-31), w.r.t. the detector z axis.
# RECO HISTOGRAMS ONLY - no cross section is extracted here.
#
# CRITERION: EQUAL-POPULATION, 24 bins over [-1, 1], sized at the full-dataset
# exposure 2.36124e20. The distribution is strongly forward-peaked (13.9% of events
# in the top 0.05 of cos, 0.24% in the bottom 0.05), so uniform bins waste most of
# the axis on the backward hemisphere and under-resolve the forward peak where the
# events actually are.
#
# NOTE - deliberately NOT the hybrid treatment used for the NuMI angle. There, a
# single fixed bin covers [-1, 0] because the backward hemisphere is genuinely
# sparse. Here it is not: 10.0% of combined and 20.5% of CONTAINED events are
# backward, so a single [-1, 0] bin would be the most populated bin in the plot
# (1889 events against 316 in the forward bins) - the opposite of the intent.
# Pure equal-population gives a max/min occupancy ratio of 1.01-1.02.
#
# Per-bin counts at full POT: 1276-1295 (combined), 381-387 (contained),
# 898-905 (exiting). At the 10% exposure currently plotted, divide by ten.
# Widths span 0.008-0.86, so per_bin_width = true is required.

# --- Combined (Contained + Exiting) ---

[variables.reco_leading_muon_polar_angle]
key = "reco_leading_muon_polar_angle_cos"
range = [-1.0, 1.0]
nbins = 24
binning_scheme = 'custom_bins'
custom_bins = [-1.0, -0.281, 0.065, 0.2626, 0.3887, 0.4834, 0.5544, 0.6123, 0.6573, 0.6975, 0.7321, 0.7629, 0.7891, 0.8121, 0.8342, 0.8542, 0.8733, 0.8912, 0.9087, 0.9256, 0.9417, 0.9574, 0.9716, 0.9854, 1.0]
xlabel = '$\cos(\theta_z)$ (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.reco_leading_muon_polar_angle_residual]
key = "reco_leading_muon_polar_angle_cos"
range = [-1, 1]
nbins = 200
xlabel = 'Reco $\cos(\theta_z)$'

[variables.true_leading_muon_polar_angle_residual]
