# leading_proton_momentum binning for the pi+- SIDEBAND (auto-generated by
# technote/sideband_binning.py). RECO HISTOGRAMS ONLY.
#
# The signal-region criterion does not apply here. Signal binning maximises
# f_diag, the fraction of events generated in a truth bin that reconstruct in
# it - a response-matrix quantity. Sideband events are background: they have no
# template parameter and are never unfolded, so they enter the fit through b_j,
# not through R. What the sideband does is contribute a Poisson term and a
# data/MC comparison, and both want uniform occupancy.
#
# CRITERION: EQUAL-POPULATION, 24 bins, weighted by ppfx_cv_weight,
# sized at full POT 2.36124e+20 (MC POT 7.17839e+20).
# Only the plain reco_* display blocks were re-binned. The true_* and
# *_smearing blocks below are carried over from the signal-region file
# unchanged and are meaningless for this sample - do not plot them.
#
#   reco_leading_proton_momentum (combined): NOT equal-population. Uses the same in-range reco edges as the signal
#       combined binning and reco_leading_proton_momentum_smearing, so histogram and smearing matrix share one axis.
#       Re-derived 2026-11-04 with the preselection reco_leading_proton_momentum >= 0.35 (axis starts at 0.35).
#   reco_leading_proton_momentum_contained: NOT equal-population. Uses the same in-range reco edges as
#       reco_leading_proton_momentum_smearing_contained, so histogram and smearing matrix share one axis.
#       (per-bin counts quoted in earlier versions are stale and were not recomputed.)
#   reco_leading_proton_momentum_exiting: 24 bins, 281 events/bin at full POT, widths 0.021 to 0.1633 (ratio 8), 98.02% of the sample in range
#
# NOT re-binned, still on the uniform binning they had (no custom_bins
# in the signal-region file): reco_leading_proton_momentum_residual_contained, reco_leading_proton_momentum_residual_exiting
#
# Widths are strongly non-uniform, so these histograms MUST be drawn with
# per_bin_width = true or the shape is meaningless.
#
# ----------------------------------------------------------------------
# Below is the header of the signal-region file leading_proton_momentum.toml, from which this
# one was generated. It documents the true_* and *_smearing blocks, which are
# carried over verbatim. Its f_diag and Cramer-Rao numbers describe the
# SIGNAL reco binning and do NOT apply to the reco_* blocks in this file.
# ----------------------------------------------------------------------
# leading_proton_momentum truth + smearing binning (auto-generated by
# technote/proton_momentum_truth_smearing_binning.py).
#
# Re-derived after the muon-containment split migration (muon_split_proton_momentum_binning.py
# already rewrote the display blocks). This script recomputes the truth and
# smearing blocks with the SAME recipe the old proton-containment version of
# this file used: equal-population truth bins (Howard's recipe, chosen because
# proton reconstruction is a one-sided low bias, not a symmetric smearing - see
# the CAVEAT block below, still applicable), then a 2:1 reco split at the
# weighted median reco value within each truth bin, clamped to 15-85% of the
# bin width. One overflow truth bin [range_hi, 1e7] is included, matching the
# OVERFLOW BIN convention used elsewhere (e.g. dpT) for a variable whose range
# is a reconstruction cut, not a physical bound.
#
# The reco_leading_proton_momentum_contained/_exiting DISPLAY blocks are also
# rewritten here to match the in-range portion of the newly-derived smearing
# reco bins, so display and smearing are internally consistent - the same
# relationship dpT and dalphaT already have between their own display and
# smearing blocks. This REPLACES the direct-on-reco equal-population display
# edges written by muon_split_proton_momentum_binning.py.
#
#   contained: 8 truth bins (+1 overflow), 16 reco bins, 21340 in range, 924 out (95.85% covered)  [re-derived 2026-11-03 with the p_mu < 0.8 GeV/c cut]
#   exiting: 8 truth bins (+1 overflow), 16 reco bins, 58663 in range, 4345 out (93.10% covered)
#
# ---------------------------------------------------------------------------------
# CAVEAT - READ BEFORE USING THE HIGH-MOMENTUM BINS. (carried over from the old
# proton-containment derivation; the underlying reconstruction bias is a property
# of proton tracking, not of which containment variable splits the sample, but the
# specific quantile numbers below were computed on the OLD contained-by-PROTON
# sample and have not been recomputed for the new contained-by-MUON sample.)
# The reconstruction is not symmetrically smeared at high p_p, it is BIASED LOW.
# q84 stays pinned near zero at every momentum while q16 runs away negative: the
# reconstruction only ever UNDER-measures. This is the signature of range
# truncation - protons flagged contained whose track is incomplete (genuinely
# exiting, or split) - i.e. the containment flag is unreliable at high momentum.
# The bins above ~0.8 GeV/c should not be treated as a clean measurement until
# the containment flag or a track-quality cut is investigated.
# ---------------------------------------------------------------------------------
# 2026-11-04: combined and contained blocks below carry the new 0.35 GeV/c axis start and the edges re-derived
# with the preselection and a minimum f_diag of 0.45, on signal events only (see leading_proton_momentum.toml: 6 combined / 9 contained
# truth bins, open-ended last bin). Display histograms end at 1.2. The exiting blocks still start at 0.31.
#
[variables.reco_leading_proton_momentum]
key = "reco_leading_proton_momentum"
range = [0.35, 1.2]
nbins = 19
binning_scheme = 'custom_bins'
custom_bins = [0.35, 0.3779, 0.4077, 0.4246, 0.4531, 0.4702, 0.4999, 0.5176, 0.5488, 0.5653, 0.5983, 0.6147, 0.65, 0.6658, 0.7092, 0.7236, 0.7814, 0.7962, 0.88, 1.2]
xlabel = 'Reco $p_p$ [GeV/c] (Contained + Exiting $p$)'
xlabel_fontsize = 10

[variables.reco_leading_proton_momentum_residual]
key = "reco_leading_proton_momentum"
range = [0.35, 1.2]
nbins = 200
xlabel = 'Reco $p_p$ [GeV/c]'

[variables.true_leading_proton_momentum_residual]
key = "true_leading_proton_momentum"
range = [0.35, 1.2]
nbins = 200
xlabel = 'True $p_p$ [GeV/c]'

[variables.reco_leading_proton_momentum_smearing]
key = "reco_leading_proton_momentum"
range = [0.35, 10000000.0]
nbins = 19
binning_scheme = 'custom_bins'
custom_bins = [0.35, 0.3779, 0.4077, 0.4246, 0.4531, 0.4702, 0.4999, 0.5176, 0.5488, 0.5653, 0.5983, 0.6147, 0.65, 0.6658, 0.7092, 0.7236, 0.7814, 0.7962, 0.88, 10000000.0]
xlabel = 'Reco $p_p$ [GeV/c] (Contained + Exiting $p$)'
xlabel_fontsize = 10

[variables.true_leading_proton_momentum_smearing]
key = "true_leading_proton_momentum"
range = [0.35, 10000000.0]
nbins = 10
binning_scheme = 'custom_bins'
custom_bins = [0.35, 0.4077, 0.4531, 0.4999, 0.5488, 0.5983, 0.65, 0.7092, 0.7814, 0.88, 10000000.0]
xlabel = 'True $p_p$ [GeV/c] (Contained + Exiting $p$)'
xlabel_fontsize = 10

