# leading_muon_length binning for the pi+- SIDEBAND (auto-generated by
# technote/sideband_binning.py). RECO HISTOGRAMS ONLY.
#
# The signal-region criterion does not apply here. Signal binning maximises
# f_diag, the fraction of events generated in a truth bin that reconstruct in
# it - a response-matrix quantity. Sideband events are background: they have no
# template parameter and are never unfolded, so they enter the fit through b_j,
# not through R. What the sideband does is contribute a Poisson term and a
# data/MC comparison, and both want uniform occupancy.
#
# CRITERION: EQUAL-POPULATION, 24 bins, weighted by ppfx_cv_weight,
# sized at full POT 2.36124e+20 (MC POT 7.17839e+20).
# Only the plain reco_* display blocks were re-binned. The true_* and
# *_smearing blocks below are carried over from the signal-region file
# unchanged and are meaningless for this sample - do not plot them.
#
#   reco_leading_muon_length: 24 bins, 449 events/bin at full POT, widths 9.98 to 251.3 (ratio 25), 99.22% of the sample in range
#   reco_leading_muon_length_contained: 24 bins, 135 events/bin at full POT, widths 6.785 to 225.6 (ratio 33), 98.99% of the sample in range
#   reco_leading_muon_length_exiting: 24 bins, 314 events/bin at full POT, widths 10.87 to 264.4 (ratio 24), 99.32% of the sample in range
#
# Widths are strongly non-uniform, so these histograms MUST be drawn with
# per_bin_width = true or the shape is meaningless.
#
# ----------------------------------------------------------------------
# Below is the header of the signal-region file leading_muon_length.toml, from which this
# one was generated. It documents the true_* and *_smearing blocks, which are
# carried over verbatim. Its f_diag and Cramer-Rao numbers describe the
# SIGNAL reco binning and do NOT apply to the reco_* blocks in this file.
# ----------------------------------------------------------------------
# Leading muon track length binning (2026-07-31). RECO HISTOGRAMS ONLY.
#
# RANGE CHANGED: [50, 500] -> [0, 800] cm. The old range held only 89.0% of selected
# events; p99 is 772 cm and the longest track is 1721 cm, so 11% of the sample was
# off the axis entirely. The old lower edge at 50 cm also clipped the exiting-muon
# low tail, which runs down to 5.5 cm (p1 = 34 cm for exiting) - i.e. short exiting
# tracks were being silently dropped from the plot. [0, 800] retains ~99%.
#
# CRITERION: EQUAL-POPULATION, 24 bins, sized at full POT 2.36124e20.
# Per-bin counts at full POT: 1274-1275 (combined), 378-379 (contained),
# 895-896 (exiting); occupancy ratio 1.00 in all three.
# Widths span 5.7-249 cm, so per_bin_width = true is required.

### leading_muon_length - Combined ------------------------------------

[variables.reco_leading_muon_length]
key = "reco_leading_muon_length"
range = [0.0, 800.0]
nbins = 24
binning_scheme = 'custom_bins'
custom_bins = [0.0, 52.0806, 62.2197, 72.2001, 82.2191, 92.7055, 103.3636, 114.2961, 126.1489, 138.1351, 151.114, 165.4026, 179.8576, 195.6755, 212.2748, 231.4751, 251.8297, 274.3647, 298.7323, 327.5895, 361.5778, 404.1794, 461.6516, 548.6881, 800.0]
xlabel = '$L_\mu$ [cm] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

