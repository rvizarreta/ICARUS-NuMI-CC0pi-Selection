# leading_pion_length binning for the pi+- SIDEBAND (auto-generated by
# technote/sideband_binning.py). RECO HISTOGRAMS ONLY.
#
# The signal-region criterion does not apply here. Signal binning maximises
# f_diag, the fraction of events generated in a truth bin that reconstruct in
# it - a response-matrix quantity. Sideband events are background: they have no
# template parameter and are never unfolded, so they enter the fit through b_j,
# not through R. What the sideband does is contribute a Poisson term and a
# data/MC comparison, and both want uniform occupancy.
#
# CRITERION: EQUAL-POPULATION, 24 bins, weighted by ppfx_cv_weight,
# sized at full POT 2.36124e+20 (MC POT 7.17839e+20).
# Only the plain reco_* display blocks were re-binned. The true_* and
# *_smearing blocks below are carried over from the signal-region file
# unchanged and are meaningless for this sample - do not plot them.
#
#   reco_leading_pion_length: 24 bins, 451 events/bin at full POT, widths 1.984 to 108.7 (ratio 55), 99.55% of the sample in range
#   reco_leading_pion_length_contained: 24 bins, 417 events/bin at full POT, widths 1.81 to 113 (ratio 62), 99.62% of the sample in range
#   reco_leading_pion_length_exiting: 24 bins, 33 events/bin at full POT, widths 2.956 to 79.65 (ratio 27), 98.62% of the sample in range
#
# Widths are strongly non-uniform, so these histograms MUST be drawn with
# per_bin_width = true or the shape is meaningless.
#
# ----------------------------------------------------------------------
# Below is the header of the signal-region file leading_pion_length.toml, from which this
# one was generated. It documents the true_* and *_smearing blocks, which are
# carried over verbatim. Its f_diag and Cramer-Rao numbers describe the
# SIGNAL reco binning and do NOT apply to the reco_* blocks in this file.
# ----------------------------------------------------------------------
# Leading pion track length binning (2026-07-31). RECO HISTOGRAMS ONLY.
#
# RANGE CHANGED: [0, 100] -> [0, 250] cm, and the edges are derived from the
# SIDEBAND, not the signal region. Reason: this file is shared by both analysis
# directories, but the two samples populate it very differently.
#     signal region (selected tree): only 5.9% of events have a leading pion at all
#                                    - 5842 entries, median 3.1 cm, p99 58 cm
#     sideband      (sideband tree): every event has one - 34420 entries,
#                                    median 33 cm, p99 212 cm, max 514 cm
# The old [0, 100] range was fine for the signal region (99.9% inside) but cut 11.4%
# of the sideband off the axis. Since the sideband is the sample this variable is
# actually used to study, and it is the one with statistics, the binning is optimised
# for it; [0, 250] covers 99% of the sideband and still contains the signal region.
#
# CONSEQUENCE FOR THE SIGNAL REGION: its pion-length histogram is sparse in this
# binning - about 1833 events at full POT spread over 24 bins, and only ~183 events
# total at the 10% exposure. Read it as a cross-check, not a measurement.
#
# CRITERION: EQUAL-POPULATION, 24 bins on the sideband, sized at full POT.
# Per-bin counts at full POT: 449-452 (occupancy ratio 1.01).
# Widths span 2.0-109 cm, so per_bin_width = true is required.

# --- Combined (Contained + Exiting) ---

[variables.reco_leading_pion_length]
key = "reco_leading_pion_length"
range = [0.0, 250.0]
nbins = 24
binning_scheme = 'custom_bins'
custom_bins = [0.0, 4.7812, 6.7767, 8.7609, 11.0202, 13.1369, 15.6611, 17.9452, 20.6832, 23.2002, 26.3499, 29.4682, 32.9993, 36.7583, 40.9229, 45.4568, 50.77, 56.6071, 63.4969, 71.9978, 81.8352, 94.4699, 111.3118, 141.2905, 250.0]
#range = [0, 10]
#nbins = 10
xlabel = '$L_\pi$ [cm] (Contained + Exiting $\pi^\pm$)'
xlabel_fontsize = 10

# --- Contained ---

[variables.reco_leading_pion_length_contained]
key = "reco_leading_pion_length"
range = [0.0, 250.0]
nbins = 24
binning_scheme = 'custom_bins'
custom_bins = [0.0, 4.6185, 6.5072, 8.3169, 10.4402, 12.3441, 14.4225, 16.768, 19.1111, 21.6954, 24.4391, 27.4482, 30.7871, 34.159, 38.1603, 42.3809, 47.5171, 53.2552, 59.7811, 68.1142, 78.1178, 90.7617, 108.1051, 137.0202, 250.0]
#range = [0, 10]
#nbins = 10
xlabel = '$L_\pi$ [cm] (Contained $\pi^\pm$)'
xlabel_fontsize = 10
mask = 'reco_leading_pion_containment == 1'

# --- Exiting ---

[variables.reco_leading_pion_length_exiting]
key = "reco_leading_pion_length"
range = [0.0, 250.0]
nbins = 24
binning_scheme = 'custom_bins'
custom_bins = [0.0, 20.3509, 26.1391, 30.2156, 34.0166, 37.4823, 41.1156, 44.396, 47.3523, 50.967, 54.7861, 58.917, 62.9228, 68.3159, 73.2925, 77.5728, 82.9475, 88.3828, 94.3261, 102.2551, 111.4455, 123.5343, 143.0916, 170.3475, 250.0]
#range = [0, 10]
#nbins = 10
xlabel = '$L_\pi$ [cm] (Exiting $\pi^\pm$)'
xlabel_fontsize = 10
mask = 'reco_leading_pion_containment == 0'
