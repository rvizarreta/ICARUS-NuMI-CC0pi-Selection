### cos(theta_mu) w.r.t. NuMI beam - binning (2026-07-28).
###
### This variable needed a DIFFERENT criterion from dpT / dalphaT / opening angle, for a
### reason specific to its shape: the selected sample is strongly forward-peaked. Before
### re-binning, 58% of combined events (72% exiting) sat in the single bin above
### cos(theta_mu) = 0.81, while the whole backward half of the axis held ~8%.
###
### The resolution-following rule used for the other variables is blind to this. Because
### the angular resolution is excellent everywhere (68% half-width 0.022 contained, 0.0065
### exiting), it produced near-uniform bins in a distribution whose event density varies by
### a factor 20-70 across the range: contained ran 143 to 3142 events per bin, combined 249
### to 17608. Those sparse backward bins carried essentially all of the uncertainty.
###
### CRITERION USED HERE (hybrid):
###   * ONE wide bin covering cos(theta_mu) < 0, where the events are sparse. This keeps
###     the backward region measurable as a single point instead of spending several
###     poorly-constrained fit parameters on it.
###   * EQUAL-POPULATION bins above 0, i.e. edges placed so each forward truth bin holds a
###     similar number of selected signal events. This is Howard's stated recipe, and it is
###     the right one here because statistics - not resolution - is what varies across the
###     axis. It is also why his cos(theta_mu) fit uses few bins.
###
### Effect (worst-bin Cramer-Rao unc at 2.36124e20 POT, and events/bin spread):
###   contained  12 bins resolution-driven: 10.8%, 22x spread  ->  9 bins hybrid: 4.4%, 2.0x
###   exiting     6 bins:                   19.0%              ->  7 bins hybrid: 5.1%, 4.9x
###   combined   12 bins:                   10.6%, 71x spread  ->  7 bins hybrid: 2.4%, 1.9x
### Diagonality is unaffected and remains high: min f_diag 0.84 / 0.91 / 0.92.
###
### Reco binning is 2:1 (median split of each truth bin, clamped to 15-85%), as for the
### other variables and as in Howard's Fig. 25. A truth column spans two reco rows, so the
### matrix diagonal is the SUM of the two on-diagonal cells; the f_diag values above are
### those sums.


### leading_muon_NuMI_angle - combined ------------------------------------

[variables.reco_leading_muon_angle_residual]
key = "reco_leading_muon_cos_theta_mu"
range = [-1, 1]
nbins = 200
xlabel = 'Reco $\cos(\theta_\mu)$ w.r.t. NuMI'
xticks = [-1.0, -0.5, 0.0, 0.5, 1.0]

