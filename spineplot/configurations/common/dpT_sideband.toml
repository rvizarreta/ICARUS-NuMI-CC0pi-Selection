# dpT binning for the pi+- SIDEBAND (auto-generated by
# technote/sideband_binning.py). RECO HISTOGRAMS ONLY.
#
# The signal-region criterion does not apply here. Signal binning maximises
# f_diag, the fraction of events generated in a truth bin that reconstruct in
# it - a response-matrix quantity. Sideband events are background: they have no
# template parameter and are never unfolded, so they enter the fit through b_j,
# not through R. What the sideband does is contribute a Poisson term and a
# data/MC comparison, and both want uniform occupancy.
#
# CRITERION: EQUAL-POPULATION, 24 bins, weighted by ppfx_cv_weight,
# sized at full POT 2.36124e+20 (MC POT 7.17839e+20).
# Only the plain reco_* display blocks were re-binned. The true_* and
# *_smearing blocks below are carried over from the signal-region file
# unchanged and are meaningless for this sample - do not plot them.
#
#   reco_dpT: 24 bins, 402 events/bin at full POT, widths 20.22 to 85.03 (ratio 4), 88.82% of the sample in range
#   reco_dpT_contained: 24 bins, 129 events/bin at full POT, widths 18.71 to 93.61 (ratio 5), 94.59% of the sample in range
#   reco_dpT_exiting: 24 bins, 273 events/bin at full POT, widths 20.54 to 86.24 (ratio 4), 86.31% of the sample in range
#
# NOT re-binned, still on the uniform binning they had (no custom_bins
# in the signal-region file): reco_dpT_residual_contained, reco_dpT_residual_exiting
#
# Widths are strongly non-uniform, so these histograms MUST be drawn with
# per_bin_width = true or the shape is meaningless.
#
# ----------------------------------------------------------------------
# Below is the header of the signal-region file dpT.toml, from which this
# one was generated. It documents the true_* and *_smearing blocks, which are
# carried over verbatim. Its f_diag and Cramer-Rao numbers describe the
# SIGNAL reco binning and do NOT apply to the reco_* blocks in this file.
# ----------------------------------------------------------------------
### dpT binning (2026-07-28).
###
### TRUTH BINNING is the physics choice: the finest binning with min f_diag above a
### per-sample threshold in every truth bin - 0.5 contained, 0.4 exiting and combined -
### over [0, 800] MeV/c, no quality cut.
###   contained N=10: min/mean f_diag 0.522/0.549, worst in-range Cramer-Rao unc 13.8%
###   exiting   N= 5: 0.420/0.441,  9.9%
###   combined  N= 6: 0.445/0.471,  7.4%      (at 2.36124e20 POT, with the overflow bin)
###
### OVERFLOW BIN [800, 1e7] on the smearing variables. This follows Howard: his fit has
### SEVEN deltaPT template parameters (#0-#6) for the SIX physical bins of his Fig. 25
### binning over 0-0.8 GeV/c, i.e. one overflow bin - and he has no such extra parameter
### for the variables whose range is a physical bound (deltaAlphaT 6 params/6 bins,
### MuonProtonCos 10/10, MuonCos 8/8). The reason it is needed here and not there: 0-800
### is a CUT, not a bound. 2.81% (contained), 5.56% (exiting) and 4.73% (combined) of
### signal has true dpT above 800 MeV/c, and 27-45% of those events RECONSTRUCT back below
### 800. Without an overflow truth bin they fill reco bins while having nowhere to live on
### the truth axis: they contaminate the top in-range reco bin at the 13-15% level
###   ([686,800] 13.2% contained, [564,800] 14.8% exiting, [598,800] 14.7% combined).
### The overflow bin absorbs them. It is partially measurable (f_diag 73% contained, 55%
### exiting, 58% combined) but should be excluded from comparisons, as Howard does.
### Cost: it competes for the same reco events, so the worst in-range uncertainty rises
### 12.7 -> 13.8% (contained), 9.8 -> 9.9% (exiting), 7.2 -> 7.4% (combined).
### The display variables keep the [0, 800] axis and are unchanged; the smearing FIGURES
### set xrange/yrange = [0, 800] so the overflow is cropped from view while the column
### normalisation still accounts for it.
###
### RECO BINNING is 2:1 throughout - each truth bin is split at the median reco value of
### the events inside it, clamped to stay within 15-85% of the bin. This matches the
### binning GUNDAM fits and the convention of Howard's technote, whose Fig. 25 (the
### smearing matrices in the extraction binning) is 2:1; the square, uniform matrices
### earlier in that note are explicitly labelled "arbitrary, uniform binning" placeholders
### shown before the analysis binning is defined, and are not a precedent for 1:1.
### Consequence for reading the plots: a truth column spreads over TWO reco rows, so the
### diagonal is the SUM of the two on-diagonal cells, not a single cell. The f_diag values
### quoted above are those sums.

### dpT - Combined ------------------------------------

