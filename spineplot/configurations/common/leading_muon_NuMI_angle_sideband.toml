# leading_muon_NuMI_angle binning for the pi+- SIDEBAND (auto-generated by
# technote/sideband_binning.py). RECO HISTOGRAMS ONLY.
#
# The signal-region criterion does not apply here. Signal binning maximises
# f_diag, the fraction of events generated in a truth bin that reconstruct in
# it - a response-matrix quantity. Sideband events are background: they have no
# template parameter and are never unfolded, so they enter the fit through b_j,
# not through R. What the sideband does is contribute a Poisson term and a
# data/MC comparison, and both want uniform occupancy.
#
# CRITERION: EQUAL-POPULATION, 24 bins, weighted by ppfx_cv_weight,
# sized at full POT 2.36124e+20 (MC POT 7.17839e+20).
# HYBRID: one fixed bin over [range_lo, 0], equal-population above.
# Carried over from the signal-region recipe for this variable - the
# backward region is sparse and is held as a single measurable point.
# Only the plain reco_* display blocks were re-binned. The true_* and
# *_smearing blocks below are carried over from the signal-region file
# unchanged and are meaningless for this sample - do not plot them.
#
#   reco_leading_muon_angle: 24 bins, 453 events/bin at full POT, widths 0.0068 to 1 (ratio 147), 100.00% of the sample in range
#   reco_leading_muon_angle_contained: 24 bins, 136 events/bin at full POT, widths 0.0139 to 1 (ratio 72), 100.00% of the sample in range
#   reco_leading_muon_angle_exiting: 24 bins, 317 events/bin at full POT, widths 0.0054 to 1 (ratio 185), 100.00% of the sample in range
#
# NOT re-binned, still on the uniform binning they had (no custom_bins
# in the signal-region file): reco_leading_muon_angle_residual_contained, reco_leading_muon_angle_residual_exiting
#
# Widths are strongly non-uniform, so these histograms MUST be drawn with
# per_bin_width = true or the shape is meaningless.
#
# ----------------------------------------------------------------------
# Below is the header of the signal-region file leading_muon_NuMI_angle.toml, from which this
# one was generated. It documents the true_* and *_smearing blocks, which are
# carried over verbatim. Its f_diag and Cramer-Rao numbers describe the
# SIGNAL reco binning and do NOT apply to the reco_* blocks in this file.
# ----------------------------------------------------------------------
### cos(theta_mu) w.r.t. NuMI beam - binning (2026-07-28).
###
### This variable needed a DIFFERENT criterion from dpT / dalphaT / opening angle, for a
### reason specific to its shape: the selected sample is strongly forward-peaked. Before
### re-binning, 58% of combined events (72% exiting) sat in the single bin above
### cos(theta_mu) = 0.81, while the whole backward half of the axis held ~8%.
###
### The resolution-following rule used for the other variables is blind to this. Because
### the angular resolution is excellent everywhere (68% half-width 0.022 contained, 0.0065
### exiting), it produced near-uniform bins in a distribution whose event density varies by
### a factor 20-70 across the range: contained ran 143 to 3142 events per bin, combined 249
### to 17608. Those sparse backward bins carried essentially all of the uncertainty.
###
### CRITERION USED HERE (hybrid):
###   * ONE wide bin covering cos(theta_mu) < 0, where the events are sparse. This keeps
###     the backward region measurable as a single point instead of spending several
###     poorly-constrained fit parameters on it.
###   * EQUAL-POPULATION bins above 0, i.e. edges placed so each forward truth bin holds a
###     similar number of selected signal events. This is Howard's stated recipe, and it is
###     the right one here because statistics - not resolution - is what varies across the
###     axis. It is also why his cos(theta_mu) fit uses few bins.
###
### Effect (worst-bin Cramer-Rao unc at 2.36124e20 POT, and events/bin spread):
###   contained  12 bins resolution-driven: 10.8%, 22x spread  ->  9 bins hybrid: 4.4%, 2.0x
###   exiting     6 bins:                   19.0%              ->  7 bins hybrid: 5.1%, 4.9x
###   combined   12 bins:                   10.6%, 71x spread  ->  7 bins hybrid: 2.4%, 1.9x
### Diagonality is unaffected and remains high: min f_diag 0.84 / 0.91 / 0.92.
###
### Reco binning is 2:1 (median split of each truth bin, clamped to 15-85%), as for the
### other variables and as in Howard's Fig. 25. A truth column spans two reco rows, so the
### matrix diagonal is the SUM of the two on-diagonal cells; the f_diag values above are
### those sums.


