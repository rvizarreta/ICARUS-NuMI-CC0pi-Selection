[variables]

### dalphaT binning (2026-07-28). TRUTH binning: finest with min f_diag above a
### per-sample threshold in every truth bin - 0.5 contained, 0.4 combined, 0.3 exiting.
### Range [0, 180] degrees, no overflow.
### Reco binning is 2:1: each truth bin is split at the median reco value of the events
### inside it (clamped to 15-85% of the bin). This is the binning GUNDAM fits, and matches
### Howard's technote Fig. 25 (smearing matrices in the extraction binning). The square /
### uniform matrices earlier in that note are explicitly "arbitrary, uniform binning"
### placeholders and are not a precedent for 1:1. A truth column therefore spans TWO reco
### rows: the diagonal is the SUM of the two on-diagonal cells, and the f_diag values
### quoted below are those sums.
### Study: min/mean f_diag = 0.533/0.584 (contained, N=7, re-derived 2026-11-03 WITH the p_mu < 0.8 GeV/c cut), 0.300/0.450 (exiting, N=5),
### 0.455/0.577 (combined, N=4). Worst Cramer-Rao unc at 2.36124e20 POT: 8.9% / 9.0% / 3.1% (contained value is pre-cut, not recomputed).
### NOTE exiting: the three central bins sit at 30-37% diagonality - the MCS-driven angular
### resolution (68% half-width 39 deg) does not support finer structure there. The two edge
### bins are strong (63%, 65%) because migration near 0 and 180 deg is one-sided.

### dalphaT - Combined ------------------------------------

[variables.reco_dalphaT_residual]
key = "reco_dalphaT_deg"
range = [0,180]
nbins = 100
xlabel = 'Reco $\delta \alpha_T$ [degrees]'
xticks = [0, 30, 60, 90, 120, 150, 180]

[variables.true_dalphaT_residual]
key = "true_dalphaT_deg"
range = [0,180]
nbins = 100
xlabel = 'True $\delta \alpha_T$ [degrees]'
xticks = [0, 30, 60, 90, 120, 150, 180]

[variables.reco_dalphaT_smearing]
key = "reco_dalphaT_deg"
range = [0,180]
nbins = 8
binning_scheme = 'custom_bins'
custom_bins = [0.0, 27.9489, 65.0, 91.0685, 114.0, 134.48, 151.0, 168.579, 180.0]
xlabel = 'Reco $\delta \alpha_T$ [degrees] (Contained + Exiting $\mu^\pm$)'
xticks = [0, 30, 60, 90, 120, 150, 180]

[variables.true_dalphaT_smearing]
key = "true_dalphaT_deg"
range = [0,180]
nbins = 4
binning_scheme = 'custom_bins'
custom_bins = [0.0, 65.0, 114.0, 151.0, 180.0]
xlabel = 'True $\delta \alpha_T$ [degrees] (Contained + Exiting $\mu^\pm$)'
xticks = [0, 30, 60, 90, 120, 150, 180]

[variables.reco_dalphaT]
key = "reco_dalphaT_deg"
range = [0,180]
nbins = 8
binning_scheme = 'custom_bins'
custom_bins = [0.0, 27.9489, 65.0, 91.0685, 114.0, 134.48, 151.0, 168.579, 180.0]
xlabel = 'Reco $\delta \alpha_T$ [degrees] (Contained + Exiting $\mu^\pm$)'
xticks = [0, 30, 60, 90, 120, 150, 180]

[variables.true_dalphaT]
