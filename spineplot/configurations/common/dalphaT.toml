### dalphaT - Contained ------------------------------------
### Extra requirement on the contained sample: reco muon momentum below 0.8 GeV/c. It is part
### of the variable mask (a reco-level selection, so it is applied to the true_* variables as
### well, as the containment cut already is) and is quoted in the xlabel suffix, which the
### plotting code turns into the box on the plot. The contained truth and reco bins below were
### re-derived with this cut applied (2026-11-03), same procedure as dpT: finest binning with
### min f_diag >= 0.5 would be N=8 (0.506), but N=7 was kept for its margin (min/mean 0.533/0.584)
### and to match the 7 truth bins of the technote. No overflow bin (bounded variable).

[variables.reco_dalphaT_residual_contained]
key = "reco_dalphaT_deg"
range = [0,180]
nbins = 100
xlabel = 'Reco $\delta \alpha_T$ [degrees]'
xticks = [0, 30, 60, 90, 120, 150, 180]
mask = '(reco_leading_primary_muon_containment == 1) & (reco_leading_primary_muon_momentum < 0.8)'

[variables.true_dalphaT_residual_contained]
key = "true_dalphaT_deg"
range = [0,180]
nbins = 100
xlabel = 'True $\delta \alpha_T$ [degrees]'
xticks = [0, 30, 60, 90, 120, 150, 180]
mask = '(reco_leading_primary_muon_containment == 1) & (reco_leading_primary_muon_momentum < 0.8)'

[variables.reco_dalphaT_smearing_contained]
key = "reco_dalphaT_deg"
range = [0,180]
nbins = 14
binning_scheme = 'custom_bins'
custom_bins = [0.0, 18.6, 37.0, 54.5, 70.0, 84.5, 98.0, 110.0, 121.0, 131.4, 141.0, 149.9, 159.0, 169.4, 180.0]
xlabel = 'Reco $\delta \alpha_T$ [degrees] (Contained $\mu^\pm$, $p_\mu < 0.8$ GeV/c)'
xticks = [0, 30, 60, 90, 120, 150, 180]
mask = '(reco_leading_primary_muon_containment == 1) & (reco_leading_primary_muon_momentum < 0.8)'

