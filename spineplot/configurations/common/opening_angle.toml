# cos(theta_mu_p) binning (2026-07-28). TRUTH binning: finest with min f_diag >= 0.7
# in every truth bin, over [-1, 1].
# Reco binning is 2:1: each truth bin is split at the median reco value of the events
# inside it (clamped to 15-85% of the bin). This is the binning GUNDAM fits, and matches
# Howard's technote Fig. 25 (smearing matrices in the extraction binning). The square /
# uniform matrices earlier in that note are explicitly "arbitrary, uniform binning"
# placeholders and are not a precedent for 1:1. A truth column therefore spans TWO reco
# rows: the diagonal is the SUM of the two on-diagonal cells, and the f_diag values
# quoted below are those sums.
#
# Note on the threshold: cos(theta_mu_p) is measured far better than the TKI variables
# (68% half-width 0.060 contained, 0.049 exiting, on an axis spanning 2.0 - about 35
# resolution elements). Diagonality therefore does not limit this variable the way it
# limits dpT and dalphaT: the 0.5/0.4/0.3 thresholds used there would admit 22/34/33 bins.
# The threshold is raised to 0.7 so the bin count is set by what the measurement needs
# rather than by what the resolution barely tolerates; this also reproduces the
# granularity of the previous configuration (10 bins).
#
# Study: min/mean f_diag = 0.706/0.733 (contained, N=10), 0.703/0.727 (exiting, N=11),
# 0.701/0.722 (combined, N=11). Worst Cramer-Rao unc at 2.36124e20 POT: 7.7% / 8.4% / 5.8%.

# --- Combined (Contained + Exiting muons) ---

[variables.reco_opening_angle]
key = "reco_opening_angle_cos"
range = [-1, 1]
nbins = 22
binning_scheme = 'custom_bins'
custom_bins = [-1.0, -0.9103, -0.84, -0.7499, -0.67, -0.5623, -0.47, -0.3642, -0.27, -0.1642, -0.0725, 0.0194, 0.105, 0.1838, 0.265, 0.3403, 0.4275, 0.5044, 0.595, 0.6824, 0.7775, 0.8711, 1.0]
xlabel = 'Reco $\cos(\theta_{\mu p})$ (Contained + Exiting $\mu^\pm$)'
xticks = [-1.0, -0.5, 0.0, 0.5, 1.0]
xlabel_fontsize = 10

[variables.true_opening_angle]
key = "true_opening_angle_cos"
range = [-1, 1]
nbins = 11
binning_scheme = 'custom_bins'
custom_bins = [-1.0, -0.84, -0.67, -0.47, -0.27, -0.0725, 0.105, 0.265, 0.4275, 0.595, 0.7775, 1.0]
xlabel = 'True $\cos(\theta_{\mu p})$ (Contained + Exiting $\mu^\pm$)'
xticks = [-1.0, -0.5, 0.0, 0.5, 1.0]
xlabel_fontsize = 10

[variables.reco_opening_angle_residual]
