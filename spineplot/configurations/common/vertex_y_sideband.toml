# vertex_y binning for the pi+- SIDEBAND (auto-generated by
# technote/sideband_binning.py). RECO HISTOGRAMS ONLY.
#
# The signal-region criterion does not apply here. Signal binning maximises
# f_diag, the fraction of events generated in a truth bin that reconstruct in
# it - a response-matrix quantity. Sideband events are background: they have no
# template parameter and are never unfolded, so they enter the fit through b_j,
# not through R. What the sideband does is contribute a Poisson term and a
# data/MC comparison, and both want uniform occupancy.
#
# CRITERION: EQUAL-POPULATION, 24 bins, weighted by ppfx_cv_weight,
# sized at full POT 2.36124e+20 (MC POT 7.17839e+20).
# Only the plain reco_* display blocks were re-binned. The true_* and
# *_smearing blocks below are carried over from the signal-region file
# unchanged and are meaningless for this sample - do not plot them.
#
#   reco_vertex_y: 24 bins, 453 events/bin at full POT, widths 10.5 to 16.6 (ratio 2), 100.00% of the sample in range
#   reco_vertex_y_contained: 24 bins, 136 events/bin at full POT, widths 9.217 to 20.41 (ratio 2), 100.00% of the sample in range
#   reco_vertex_y_exiting: 24 bins, 317 events/bin at full POT, widths 10.4 to 15.45 (ratio 1), 100.00% of the sample in range
#
# NOT re-binned, still on the uniform binning they had (no custom_bins
# in the signal-region file): reco_vertex_y_residual_contained, reco_vertex_y_residual_exiting
#
# Widths are strongly non-uniform, so these histograms MUST be drawn with
# per_bin_width = true or the shape is meaningless.
#
# ----------------------------------------------------------------------
# Below is the header of the signal-region file vertex_y.toml, from which this
# one was generated. It documents the true_* and *_smearing blocks, which are
# carried over verbatim. Its f_diag and Cramer-Rao numbers describe the
# SIGNAL reco binning and do NOT apply to the reco_* blocks in this file.
# ----------------------------------------------------------------------
# Reconstructed vertex y binning (2026-07-31). RECO HISTOGRAMS ONLY.
#
# RANGE CHANGED: [-200, 200] -> [-160, 115]. The data span only [-156.8, 110.0] and
# the distribution is ASYMMETRIC about zero, so the old symmetric range left a third
# of the axis blank, most of it above y = 110.
#
# CRITERION: EQUAL-POPULATION, 24 bins, sized at full POT 2.36124e20.
# The distribution is flat, so this comes out close to uniform anyway - widths span
# only 10.2-16.9 cm (ratio 1.7), which is the check that equal-population is harmless
# here (unlike vertex_x, where a detector gap makes it actively wrong).
# Per-bin counts at full POT: 1274-1299, occupancy ratio 1.02.

# --- Combined (Contained + Exiting muons) ---

[variables.reco_vertex_y]
key = "reco_vertex_y"
range = [-160.0, 115.0]
nbins = 24
binning_scheme = 'custom_bins'
custom_bins = [-160.0, -147.11, -136.11, -125.01, -114.21, -103.71, -92.31, -81.36, -70.41, -59.21, -48.31, -37.3459, -26.412, -15.01, -4.11, 6.9947, 18.09, 29.49, 40.59, 51.69, 62.59, 74.19, 86.3525, 98.403, 115.0]
xlabel = 'Reco Vertex Y [cm] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.reco_vertex_y_residual]
key = "reco_vertex_y"
range = [-200, 200]
nbins = 200
xlabel = 'Reco Vertex Y [cm]'

[variables.true_vertex_y_residual]
key = "true_vertex_y"
range = [-200, 200]
nbins = 200
xlabel = 'True Vertex Y [cm]'

[variables.reco_vertex_y_smearing]
key = "reco_vertex_y"
range = [-200, 200]
nbins = 10
xlabel = 'Reco Vertex Y [cm] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.true_vertex_y_smearing]
