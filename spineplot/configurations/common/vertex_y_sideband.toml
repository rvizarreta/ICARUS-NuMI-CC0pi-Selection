# vertex_y binning for the pi+- SIDEBAND (auto-generated by
# technote/sideband_binning.py). RECO HISTOGRAMS ONLY.
#
# The signal-region criterion does not apply here. Signal binning maximises
# f_diag, the fraction of events generated in a truth bin that reconstruct in
# it - a response-matrix quantity. Sideband events are background: they have no
# template parameter and are never unfolded, so they enter the fit through b_j,
# not through R. What the sideband does is contribute a Poisson term and a
# data/MC comparison, and both want uniform occupancy.
#
# CRITERION: reco_vertex_y (combined) uses the same 40 reco edges as the signal smearing matrix.
# reco_vertex_y_contained and reco_vertex_y_exiting stay equal-population, 24 bins,
# weighted by ppfx_cv_weight, sized at full POT 2.36124e+20 (MC POT 7.17839e+20).
# The true_* and *_smearing blocks below are copied from the signal-region file
# and are diagnostics for this sample.
#
#   reco_vertex_y: 40 bins, same edges as the signal-region combined reco axis and reco_vertex_y_smearing.
#   reco_vertex_y_contained: 24 bins, 136 events/bin at full POT, widths 9.217 to 20.41 (ratio 2), 100.00% of the sample in range
#   reco_vertex_y_exiting: 24 bins, 317 events/bin at full POT, widths 10.4 to 15.45 (ratio 1), 100.00% of the sample in range
#
# NOT re-binned, still on the uniform binning they had (no custom_bins
# in the signal-region file): reco_vertex_y_residual_contained, reco_vertex_y_residual_exiting
#
# ----------------------------------------------------------------------
# Header of the signal-region file vertex_y.toml (combined binning copied below):
# ----------------------------------------------------------------------
# Vertex y binning (2026-11-03). SIGNAL-REGION BINNING (copied into this sideband file).
#
# f_diag does NOT choose the bins here. The vertex y resolution is ~0.2 cm (median |reco-true|), so any
# bin of several cm loses almost nothing to migration and f_diag stays far above the 0.70 used for the
# angular variables (it is 0.96-0.98 for the bins below). Statistics set the width instead.
#
# CRITERION: 20 truth bins (same count as vertex x), EQUAL-POPULATION in truth: edges are weighted
# quantiles (ppfx_cv_weight) of the true vertex y of signal events, so every truth bin holds
# 1263-1279 signal events at full POT 2.36124e20. The distribution is flat, so widths are close to
# uniform (12.7-20.5 cm). First and last edge are the range limits [-160, 115].
# Each truth bin is split into two reco bins at the median reco y inside it (clamped to 15-85%), as for the
# other variables, so reco has 40 bins.
#
# RESULT: 20 truth bins, 40 reco bins. Worst-bin f_diag = 0.960.
# reco_vertex_y (display histogram) uses the same edges as reco_vertex_y_smearing.
# Contained and exiting blocks below are unchanged (display only).
#
# RANGE: [-160, 115] cm. The data span [-156.9, 110.0] (true), [-156.8, 109.9] (reco).

# --- Combined (Contained + Exiting muons) ---

[variables.reco_vertex_y]
key = "reco_vertex_y"
range = [-160.0, 115.0]
nbins = 40
binning_scheme = 'custom_bins'
custom_bins = [-160.0, -149.5, -143.1, -136.3, -129.8, -123.5, -117.1, -110.5, -103.7, -97.3, -90.9, -84.5, -78.0, -71.6, -65.3, -58.9, -52.5, -45.8, -39.1, -32.5, -26.0, -19.5, -13.0, -6.8, -0.2, 6.4, 12.9, 19.5, 26.3, 32.9, 39.4, 46.0, 52.8, 59.8, 66.5, 73.2, 80.2, 87.4, 94.5, 101.6, 115.0]
