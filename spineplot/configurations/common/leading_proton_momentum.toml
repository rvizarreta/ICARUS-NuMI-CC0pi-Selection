# leading_proton_momentum truth + smearing binning, COMBINED SAMPLE, re-derived 2026-11-09 with NO preselection on the
# proton momentum (the range starts at 0.31 GeV/c, the lowest value in the selected sample).
# COMBINED SAMPLE ONLY is the one used for the cross section. The contained and exiting blocks were not touched.
#
# CRITERION: SIGNAL EVENTS ONLY (true_category 0, 1, 2), weighted by ppfx_cv_weight. Minimum f_diag per truth bin
# = 0.70 (raised from 0.50 on 2026-11-10, same as opening angle and dpTT_lp), where f_diag is the fraction of events generated in a truth bin that are reconstructed in the same range.
# Proton reconstruction is a one-sided low bias, so the highest bin has the lowest f_diag. The last truth bin is
# open-ended, [0.7092, 1e7], and is split in two reco bins at 0.83 (the reco median of the signal inside it, so the 2:1 nesting
# holds for every truth bin); the display blocks (reco_/true_leading_primary_proton_momentum)
# stop at 1.2, so their last bin is the truncated view [0.83, 1.2].
# TRUTH BINS: six equal-width closed bins over [0.31, 0.7092] (width 0.0665) plus the open-ended bin [0.7092, 1e7]. Re-derived
# 2026-11-11: the reco momentum has a dip at 0.39-0.40, a spike at 0.40-0.41 and jumps of about 15% on the 0.01 GeV/c scale
# (the true momentum is smooth), so with the earlier equal-population bins (reco widths 0.021-0.030) the histogram went up
# and down from bin to bin (6 significant reversals); with these bins there is 1. The upper edge 0.7092 is where the open-ended
# last bin still has f_diag >= 0.70 (0.723). Closed truth bins hold 2413-3252 signal events at 2.36124e20 POT, the open bin 8773.
# Reco bins: each closed truth bin is split in two at its midpoint, so every closed reco bin below 0.7092 is 0.0332 wide;
# the open-ended last truth bin is split at 0.83.
#
#   combined : 7 truth bins, 14 reco bins. Worst f_diag = 0.723 (last bin)
#              truth edges [0.31, 0.3765, 0.4431, 0.5096, 0.5761, 0.6427, 0.7092, 10000000.0]
#              f_diag per truth bin [0.967, 0.831, 0.833, 0.816, 0.769, 0.731, 0.723]
#              numbers from the selected tree of icarus_numi_numu_mc_onbeam_offbeam_syst_ppfx.root (file dated 2026-11-07)
#
# Widths are strongly non-uniform, so histograms of these blocks MUST be drawn with per_bin_width = true.
[variables.reco_leading_primary_proton_momentum]
key = "reco_leading_primary_proton_momentum"
range = [0.31, 1.2]
nbins = 14
binning_scheme = 'custom_bins'
custom_bins = [0.31, 0.3432, 0.3765, 0.4098, 0.4431, 0.4764, 0.5096, 0.5429, 0.5761, 0.6094, 0.6427, 0.676, 0.7092, 0.83, 1.2]
xlabel = 'Reco $p_p$ [GeV/c] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.reco_leading_primary_proton_momentum_residual]
key = "reco_leading_primary_proton_momentum"
range = [0.31, 1.2]
nbins = 200
xlabel = 'Reco $p_p$ [GeV/c]'

[variables.true_leading_primary_proton_momentum_residual]
key = "true_leading_primary_proton_momentum"
range = [0.31, 1.2]
nbins = 200
xlabel = 'True $p_p$ [GeV/c]'

[variables.reco_leading_primary_proton_momentum_smearing]
key = "reco_leading_primary_proton_momentum"
range = [0.31, 10000000.0]
nbins = 14
binning_scheme = 'custom_bins'
custom_bins = [0.31, 0.3432, 0.3765, 0.4098, 0.4431, 0.4764, 0.5096, 0.5429, 0.5761, 0.6094, 0.6427, 0.676, 0.7092, 0.83, 10000000.0]
xlabel = 'Reco $p_p$ [GeV/c] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.true_leading_primary_proton_momentum_smearing]
key = "true_leading_primary_proton_momentum"
range = [0.31, 10000000.0]
nbins = 7
binning_scheme = 'custom_bins'
custom_bins = [0.31, 0.3765, 0.4431, 0.5096, 0.5761, 0.6427, 0.7092, 10000000.0]
xlabel = 'True $p_p$ [GeV/c] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

### Leading proton momentum - Contained muon sample ------------------------------------
