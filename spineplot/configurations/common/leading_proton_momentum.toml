# leading_proton_momentum truth + smearing binning, COMBINED SAMPLE, re-derived 2026-11-09 with NO preselection on the
# proton momentum (the range starts at 0.31 GeV/c, the lowest value in the selected sample).
# COMBINED SAMPLE ONLY is the one used for the cross section. The contained and exiting blocks were not touched.
#
# CRITERION: SIGNAL EVENTS ONLY (true_category 0, 1, 2), weighted by ppfx_cv_weight. Minimum f_diag per truth bin
# = 0.70 (raised from 0.50 on 2026-11-10, same as opening angle and dpTT_lp), where f_diag is the fraction of events generated in a truth bin that are reconstructed in the same range.
# Proton reconstruction is a one-sided low bias, so the highest bin has the lowest f_diag. The last truth bin is
# open-ended, [0.7092, 1e7], and a single reco bin; the display blocks (reco_/true_leading_primary_proton_momentum)
# stop at 1.2, so their last bin is the truncated view [0.7092, 1.2].
# The closed bins above 0.4077 are the equal-population bins derived earlier (about 8.2-8.7% of the signal each).
# At 0.70 the three highest bins of the 0.50 binning (f_diag 0.659, 0.599, 0.504) fail, so they were merged into one open-ended bin [0.7092, 1e7] (f_diag 0.723, 34% of the signal).
# Without the 0.35 presel the old first bin [0.31, 0.4077] held 15% of the signal, so it was split at the median of
# the true momentum inside it (0.366). Reco bins: each closed truth bin is split in two at the truth-bin midpoint,
# not at the median reco value (which gave alternating narrow and wide bins)(equal-width halves, so adjacent reco bins have similar widths; reviewer request).
#
#   combined : 9 truth bins, 17 reco bins. Worst f_diag = 0.714 (bin [0.65, 0.7092])
#              truth edges [0.31, 0.366, 0.4077, 0.4531, 0.4999, 0.5488, 0.5983, 0.65, 0.7092, 10000000.0]
#              f_diag per truth bin [0.957, 0.733, 0.798, 0.788, 0.783, 0.768, 0.755, 0.714, 0.723]
#              numbers from the selected tree of icarus_numi_numu_mc_onbeam_offbeam_syst_ppfx.root (file dated 2026-11-07)
#
# Widths are strongly non-uniform, so histograms of these blocks MUST be drawn with per_bin_width = true.
[variables.reco_leading_primary_proton_momentum]
key = "reco_leading_primary_proton_momentum"
range = [0.31, 1.2]
nbins = 17
binning_scheme = 'custom_bins'
custom_bins = [0.31, 0.338, 0.366, 0.3869, 0.4077, 0.4304, 0.4531, 0.4765, 0.4999, 0.5243, 0.5488, 0.5736, 0.5983, 0.6241, 0.65, 0.6796, 0.7092, 1.2]
xlabel = 'Reco $p_p$ [GeV/c] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.reco_leading_primary_proton_momentum_residual]
key = "reco_leading_primary_proton_momentum"
range = [0.31, 1.2]
nbins = 200
xlabel = 'Reco $p_p$ [GeV/c]'

[variables.true_leading_primary_proton_momentum_residual]
key = "true_leading_primary_proton_momentum"
range = [0.31, 1.2]
nbins = 200
xlabel = 'True $p_p$ [GeV/c]'

[variables.reco_leading_primary_proton_momentum_smearing]
key = "reco_leading_primary_proton_momentum"
range = [0.31, 10000000.0]
nbins = 17
binning_scheme = 'custom_bins'
custom_bins = [0.31, 0.338, 0.366, 0.3869, 0.4077, 0.4304, 0.4531, 0.4765, 0.4999, 0.5243, 0.5488, 0.5736, 0.5983, 0.6241, 0.65, 0.6796, 0.7092, 10000000.0]
xlabel = 'Reco $p_p$ [GeV/c] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.true_leading_primary_proton_momentum_smearing]
key = "true_leading_primary_proton_momentum"
range = [0.31, 10000000.0]
nbins = 9
binning_scheme = 'custom_bins'
custom_bins = [0.31, 0.366, 0.4077, 0.4531, 0.4999, 0.5488, 0.5983, 0.65, 0.7092, 10000000.0]
xlabel = 'True $p_p$ [GeV/c] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

