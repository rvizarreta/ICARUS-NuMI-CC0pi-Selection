# leading_proton_momentum COMBINED truth + smearing binning (auto-generated by
# technote/proton_momentum_combined_binning.py). No containment mask -
# this is the full inclusive selected-signal sample.
#
# Same recipe as the contained/exiting derivation in
# proton_momentum_truth_smearing_binning.py: equal-population truth bins
# (Howard's recipe - proton reconstruction is a one-sided low bias, not a
# symmetric smearing, so resolution-following truth binning doesn't apply),
# one overflow truth bin [1.2, 1e7], and a 2:1 reco split at the weighted
# median reco value within each truth bin, clamped to 15-85% of the bin
# width. This REPLACES a prior true_leading_proton_momentum_smearing block
# whose round-number edges ([0.31, 0.42, 0.54, ...]) were not a genuine
# equal-population derivation.
#
#   8 truth bins (+1 overflow), 16 reco bins, 86060 in range, 5519 out (93.97% covered)
#
# Widths are strongly non-uniform, so histograms of these blocks MUST be
# drawn with per_bin_width = true or the shape is meaningless.
[variables.reco_leading_proton_momentum]
key = "reco_leading_proton_momentum"
range = [0.31, 1.2]
nbins = 16
binning_scheme = 'custom_bins'
custom_bins = [0.31, 0.3514, 0.3927, 0.4187, 0.4571, 0.4851, 0.5239, 0.5504, 0.5934, 0.6181, 0.6689, 0.6923, 0.762, 0.783, 0.9018, 0.9465, 1.2]
xlabel = 'Reco $p_p$ [GeV/c] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.reco_leading_proton_momentum_residual]
key = "reco_leading_proton_momentum"
range = [0.31, 1.2]
nbins = 200
xlabel = 'Reco $p_p$ [GeV/c]'

[variables.true_leading_proton_momentum_residual]
key = "true_leading_proton_momentum"
range = [0.31, 1.2]
nbins = 200
xlabel = 'True $p_p$ [GeV/c]'

[variables.reco_leading_proton_momentum_smearing]
