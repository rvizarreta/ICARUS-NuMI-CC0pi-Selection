# leading_proton_momentum truth + smearing binning, RE-DERIVED 2026-11-04 WITH THE PRESELECTION
# reco_leading_primary_proton_momentum >= 0.35 GeV/c (presel in the analysis TOMLs).
# COMBINED SAMPLE ONLY is the one used for the cross section. The contained blocks were not updated in the
# last step (see the end of this header).
#
# COMBINED CRITERION: SIGNAL EVENTS ONLY (true_category 0, 1, 2; same basis as dpT, dalphaT and the other
# variables), weighted by ppfx_cv_weight. Minimum f_diag per truth bin = 0.50, where f_diag is the fraction of
# events generated in a truth bin (and passing the preselection) that are reconstructed in the same range.
# Proton reconstruction is a one-sided low bias, so the highest bin has the lowest f_diag. The last truth bin is
# open-ended, [0.88, 1e7] (no separate overflow bin: it could never reach 0.5, it was ~0.18), and it is made
# LARGER on purpose: it starts at 0.88 GeV/c, below where an equal-population split would put it (~0.92-0.97),
# because f_diag of the last bin falls as its lower edge rises. That frees the bins below it to be finer:
# 9 closed equal-population truth bins over [0.35, 0.88] (2120 signal events each at full POT 2.36124e20), plus
# the open last bin (4582 events, 19% of the sample).
# Each closed truth bin is split into two reco bins at the weighted median reco value inside it, clamped to
# 15-85%; the last truth bin is a single reco bin (a median split there gives a sliver).
# The display blocks (reco_/true_leading_primary_proton_momentum) stop at 1.2: their last bin is [0.88, 1.2], a truncated
# view of the open-ended last bin of the smearing blocks.
#
#   combined : 10 truth bins, 19 reco bins, 76047 signal events with true >= 0.35. Worst f_diag = 0.528
#              truth edges [0.35, 0.4077, 0.4531, 0.4999, 0.5488, 0.5983, 0.65, 0.7092, 0.7814, 0.88, 10000000.0]
#              f_diag per truth bin [0.958, 0.82, 0.796, 0.788, 0.767, 0.746, 0.705, 0.648, 0.589, 0.528]
#              (an equal-population split into 6 bins with no larger last bin gave 0.475 at best)
# The first bin is high partly because the preselection already removes events reconstructed below 0.35.
#
# CONTAINED (muon contained, p_mu < 0.8) and EXITING: NOT part of this update. The contained blocks still carry
# the previous derivation (equal-population, minimum f_diag 0.45, 9 truth bins, last edge 0.9248); the exiting
# blocks still start at 0.31.
#
# Widths are strongly non-uniform, so histograms of these blocks MUST be drawn with
# per_bin_width = true or the shape is meaningless.
[variables.reco_leading_primary_proton_momentum]
key = "reco_leading_primary_proton_momentum"
range = [0.35, 1.2]
nbins = 19
binning_scheme = 'custom_bins'
custom_bins = [0.35, 0.3779, 0.4077, 0.4246, 0.4531, 0.4702, 0.4999, 0.5176, 0.5488, 0.5653, 0.5983, 0.6147, 0.65, 0.6658, 0.7092, 0.7236, 0.7814, 0.7962, 0.88, 1.2]
xlabel = 'Reco $p_p$ [GeV/c] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.reco_leading_primary_proton_momentum_residual]
key = "reco_leading_primary_proton_momentum"
range = [0.35, 1.2]
nbins = 200
xlabel = 'Reco $p_p$ [GeV/c]'

[variables.true_leading_primary_proton_momentum_residual]
key = "true_leading_primary_proton_momentum"
range = [0.35, 1.2]
nbins = 200
xlabel = 'True $p_p$ [GeV/c]'

[variables.reco_leading_primary_proton_momentum_smearing]
key = "reco_leading_primary_proton_momentum"
range = [0.35, 10000000.0]
nbins = 19
binning_scheme = 'custom_bins'
custom_bins = [0.35, 0.3779, 0.4077, 0.4246, 0.4531, 0.4702, 0.4999, 0.5176, 0.5488, 0.5653, 0.5983, 0.6147, 0.65, 0.6658, 0.7092, 0.7236, 0.7814, 0.7962, 0.88, 10000000.0]
xlabel = 'Reco $p_p$ [GeV/c] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.true_leading_primary_proton_momentum_smearing]
key = "true_leading_primary_proton_momentum"
range = [0.35, 10000000.0]
nbins = 10
binning_scheme = 'custom_bins'
custom_bins = [0.35, 0.4077, 0.4531, 0.4999, 0.5488, 0.5983, 0.65, 0.7092, 0.7814, 0.88, 10000000.0]
xlabel = 'True $p_p$ [GeV/c] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

### Leading proton momentum - Contained muon sample ------------------------------------
