# --- Combined (Contained + Exiting) ---

[variables.reco_leading_muon_polar_angle]
key = "reco_leading_muon_polar_angle_cos"
range = [-1, 1]
nbins = 25
xlabel = '$\cos(\theta_z)$ (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.reco_leading_muon_polar_angle_residual]
key = "reco_leading_muon_polar_angle_cos"
range = [-1, 1]
nbins = 200
xlabel = 'Reco $\cos(\theta_z)$'

[variables.true_leading_muon_polar_angle_residual]
key = "true_leading_muon_polar_angle_cos"
range = [-1, 1]
nbins = 200
xlabel = 'True $\cos(\theta_z)$'

[variables.reco_leading_muon_polar_angle_smearing]
key = "reco_leading_muon_polar_angle_cos"
range = [-1, 1]
nbins = 10
xlabel = 'Reco $\cos(\theta_z)$ (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.true_leading_muon_polar_angle_smearing]
key = "true_leading_muon_polar_angle_cos"
range = [-1, 1]
nbins = 10
xlabel = 'True $\cos(\theta_z)$ (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.abs_leading_muon_polar_angle_residual]
key = "abs_leading_muon_polar_angle_residual"
range = [-0.5, 0.5]
nbins = 50
xlabel = '$\cos(\theta_z)_\mathrm{reco} - \cos(\theta_z)_\mathrm{true}$ (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

