# Vertex z binning (2026-11-03). CROSS-SECTION VARIABLE, COMBINED (contained + exiting) SAMPLE ONLY.
#
# f_diag does NOT choose the bins here. The vertex z resolution is ~0.2 cm (median |reco-true|), so any
# bin of several cm loses almost nothing to migration and f_diag stays far above the 0.70 used for the
# angular variables (it is 0.99-1.00 for the bins below). Statistics set the width instead.
#
# CRITERION: 20 truth bins (same count as vertex x), EQUAL-POPULATION in truth: edges are weighted
# quantiles (ppfx_cv_weight) of the true vertex z of signal events, so every truth bin holds
# 1268-1272 signal events at full POT 2.36124e20. The distribution is flat, so widths are close to
# uniform (81.7-107.9 cm). First and last edge are the range limits [-880, 860].
# Each truth bin is split into two reco bins at the median reco z inside it (clamped to 15-85%), as for the
# other variables, so reco has 40 bins.
#
# RESULT: 20 truth bins, 40 reco bins. Worst-bin f_diag = 0.990.
# reco_vertex_z (display histogram) uses the same edges as reco_vertex_z_smearing.
# Contained and exiting blocks below are unchanged (display only).
#
# RANGE: [-880, 860] cm. The data span [-864.9, 844.9] (true), [-865.0, 844.9] (reco).

# --- Combined (Contained + Exiting muons) ---

[variables.reco_vertex_z]
key = "reco_vertex_z"
range = [-880.0, 860.0]
nbins = 40
binning_scheme = 'custom_bins'
custom_bins = [-880.0, -817.4, -772.1, -728.2, -686.4, -643.7, -600.7, -559.6, -517.3, -476.3, -433.5, -393.1, -351.1, -310.8, -269.4, -227.5, -186.2, -144.3, -101.6, -59.2, -17.3, 26.3, 67.5, 109.6, 150.7, 192.5, 235.2, 276.8, 320.1, 364.9, 408.6, 450.4, 492.6, 534.8, 577.1, 620.5, 661.0, 705.5, 752.1, 796.6, 860.0]
xlabel = 'Reco Vertex Z [cm] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.true_vertex_z]
key = "true_vertex_z"
range = [-880.0, 860.0]
nbins = 20
binning_scheme = 'custom_bins'
custom_bins = [-880.0, -772.1, -686.4, -600.7, -517.3, -433.5, -351.1, -269.4, -186.2, -101.6, -17.3, 67.5, 150.7, 235.2, 320.1, 408.6, 492.6, 577.1, 661.0, 752.1, 860.0]
xlabel = 'True Vertex Z [cm] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.reco_vertex_z_residual]
key = "reco_vertex_z"
range = [-1000, 1000]
nbins = 200
xlabel = 'Reco Vertex Z [cm]'

[variables.true_vertex_z_residual]
key = "true_vertex_z"
range = [-1000, 1000]
nbins = 200
xlabel = 'True Vertex Z [cm]'

[variables.reco_vertex_z_smearing]
key = "reco_vertex_z"
range = [-880.0, 860.0]
nbins = 40
binning_scheme = 'custom_bins'
custom_bins = [-880.0, -817.4, -772.1, -728.2, -686.4, -643.7, -600.7, -559.6, -517.3, -476.3, -433.5, -393.1, -351.1, -310.8, -269.4, -227.5, -186.2, -144.3, -101.6, -59.2, -17.3, 26.3, 67.5, 109.6, 150.7, 192.5, 235.2, 276.8, 320.1, 364.9, 408.6, 450.4, 492.6, 534.8, 577.1, 620.5, 661.0, 705.5, 752.1, 796.6, 860.0]
xlabel = 'Reco Vertex Z [cm] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.true_vertex_z_smearing]
key = "true_vertex_z"
range = [-880.0, 860.0]
nbins = 20
binning_scheme = 'custom_bins'
custom_bins = [-880.0, -772.1, -686.4, -600.7, -517.3, -433.5, -351.1, -269.4, -186.2, -101.6, -17.3, 67.5, 150.7, 235.2, 320.1, 408.6, 492.6, 577.1, 661.0, 752.1, 860.0]
xlabel = 'True Vertex Z [cm] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

