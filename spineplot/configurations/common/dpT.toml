range = [0.0, 10000000.0]
nbins = 7
binning_scheme = 'custom_bins'
custom_bins = [0.0, 135.0, 246.0, 352.0, 465.0, 598.0, 800.0, 1e+07]
xlabel = 'True $\delta p_T$ [MeV/c] (Contained + Exiting $\mu^\pm$)'

