### dphiT binning (2026-11-03). CROSS-SECTION VARIABLE, COMBINED (contained + exiting) SAMPLE ONLY.
### Only the combined blocks (true_dphiT, reco_dphiT, *_smearing) are binned for the
### cross section. The contained and exiting blocks below are display-only
### (equal-population, 24 bins) and are NOT tied to the response matrix.
###
### CRITERION: f_diag. Truth bins are the finest set whose worst-bin f_diag stays
### above 0.40 (same threshold used for the combined sample in dpT and dalphaT).
### f_diag is the fraction of events generated in a truth bin that are reconstructed
### in the same bin range. Each truth bin is split into two reco bins (2:1 nesting),
### so the diagonal of the smearing matrix is the sum of two reco rows.
### Procedure: technote/binning_walkthrough.py, signal events only, ppfx_cv_weight,
### 1 degree grid, no p_mu cut (combined sample).
###
### RESULT: 15 truth bins, 30 reco bins over [0, 180] degrees.
###   truth: [0.0, 5.0, 10.0, 16.0, 23.0, 31.0, 40.0, 50.0, 61.0, 73.0, 85.0, 98.0, 113.0, 129.0, 146.0, 180.0]
###   reco : [0.0, 2.4, 5.0, 7.4, 10.0, 12.8, 16.0, 19.2, 23.0, 26.7, 31.0, 35.1, 40.0, 44.6, 50.0, 55.2, 61.0, 66.5, 73.0, 78.4, 85.0, 90.9, 98.0, 105.2, 113.0, 120.7, 129.0, 136.8, 146.0, 162.3, 180.0]
###   worst-bin f_diag = 0.414  (N=15 is where the sweep stops: its bin-width
###   parameter m reaches 1 degree, the grid step. Finer binning was not tested.)
### delta phi_T is bounded in [0, 180], so there is no overflow bin. The last truth
### bin [146, 180] is 34 degrees wide (f_diag 0.709); the procedure gives wide bins
### where the events are few.
###
### Bin widths span 5-34 degrees, so histograms MUST be drawn with per_bin_width = true.

### dphiT - Combined ------------------------------------

[variables.reco_dphiT_residual]
key = "reco_dphiT_deg"
range = [0,180]
nbins = 100
xlabel = 'Reco $\delta \phi_T$ [degrees]'

[variables.true_dphiT_residual]
key = "true_dphiT_deg"
range = [0,180]
nbins = 100
xlabel = 'True $\delta \phi_T$ [degrees]'

[variables.reco_dphiT_smearing]
key = "reco_dphiT_deg"
range = [0,180]
nbins = 30
binning_scheme = 'custom_bins'
custom_bins = [0.0, 2.4, 5.0, 7.4, 10.0, 12.8, 16.0, 19.2, 23.0, 26.7, 31.0, 35.1, 40.0, 44.6, 50.0, 55.2, 61.0, 66.5, 73.0, 78.4, 85.0, 90.9, 98.0, 105.2, 113.0, 120.7, 129.0, 136.8, 146.0, 162.3, 180.0]
