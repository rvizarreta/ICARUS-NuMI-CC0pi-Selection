# leading_pion_length binning, SIGNAL SELECTION (2026-11-03). RECO HISTOGRAMS ONLY.
#
# COMBINED SAMPLE, SHORT PIONS ONLY: the axis is zoomed to [0, 10] cm on purpose. In the signal selection
# only 5451 MC entries (6.0% of events) have a leading pion candidate at all, 1707 events
# at full POT (2.36124e20), median length 3.1 cm. We only care about short pions here, so the range stops
# at 10 cm: 78.0% of those candidates (1331 events at full POT) lie inside it. The rest are
# not shown.
#
# CRITERION: EQUAL-POPULATION with a 0.5 cm MINIMUM WIDTH, 10 bins over [0, 10] cm, weighted by
# ppfx_cv_weight, edges rounded to 0.1 cm. Per-bin counts at full POT: 53-210.
# Why not finer: the reco lengths are quantised (about 90 distinct values below 3 cm, ~29 entries each), so
# an earlier 19-bin version with 0.14-0.29 cm wide bins sat on those spikes and its bin heights alternated
# (54-88 events) even though it was nominally equal-population. 0.5 cm spans several quantisation steps.
# Widths span 0.5-2.7 cm.
# The sideband uses its own binning (leading_pion_length_sideband.toml), which is fine for this variable.
#
# Contained and exiting blocks below are NOT re-derived: they keep the old sideband-derived edges and
# are not usable in the signal selection (the exiting split holds ~1 event per bin).
#
# Widths are non-uniform, so these histograms MUST be drawn with per_bin_width = true.

[variables.reco_leading_pion_length]
key = "reco_leading_pion_length"
range = [0.0, 10.0]
nbins = 10
binning_scheme = 'custom_bins'
custom_bins = [0.0, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 5.4, 7.3, 10.0]
#range = [0, 10]
#nbins = 10
xlabel = '$L_\pi$ [cm] (Contained + Exiting $\pi^\pm$)'
xlabel_fontsize = 10

# --- Contained ---

[variables.reco_leading_pion_length_contained]
key = "reco_leading_pion_length"
range = [0.0, 10.0]
nbins = 24
binning_scheme = 'custom_bins'
custom_bins = [0.0, 4.7812, 6.7767, 8.7608, 11.02, 13.1366, 15.6584, 17.945, 20.6829, 23.1999, 26.3482, 29.4682, 32.9971, 36.7541, 40.9215, 45.4557, 50.7697, 56.6052, 63.4947, 71.9971, 81.8334, 94.469, 111.3103, 141.2853, 250.0]
#range = [0, 10]
#nbins = 10
xlabel = '$L_\pi$ [cm] (Contained $\mu^\pm$)'
xlabel_fontsize = 10
mask = 'reco_leading_muon_containment == 1'

# --- Exiting ---

[variables.reco_leading_pion_length_exiting]
key = "reco_leading_pion_length"
range = [0.0, 10.0]
nbins = 24
binning_scheme = 'custom_bins'
custom_bins = [0.0, 4.7812, 6.7767, 8.7608, 11.02, 13.1366, 15.6584, 17.945, 20.6829, 23.1999, 26.3482, 29.4682, 32.9971, 36.7541, 40.9215, 45.4557, 50.7697, 56.6052, 63.4947, 71.9971, 81.8334, 94.469, 111.3103, 141.2853, 250.0]
#range = [0, 10]
#nbins = 10
xlabel = '$L_\pi$ [cm] (Exiting $\mu^\pm$)'
xlabel_fontsize = 10
mask = 'reco_leading_muon_containment == 0'
