# leading_pion_length binning, SIGNAL SELECTION (re-derived 2026-11-11). RECO HISTOGRAMS ONLY.
#
# COMBINED SAMPLE, SHORT PIONS ONLY. With the leading_primary selector only 1971 of 91579 selected MC entries (2.2%)
# have a leading primary pion candidate, 624 events at 2.36124e20 POT (MC POT 7.095834e20). Their lengths run from
# 0.30 to 2.86 cm (median 1.80 cm), so the axis is [0, 3] cm and every candidate is inside it. The earlier version of
# this file (10 bins over [0, 10] cm) was derived with the old leading selector, which had 5451 entries and a median
# of 3.1 cm; above 3 cm that axis is now empty.
#
# CRITERION: EQUAL-POPULATION, 6 bins over [0, 3] cm, weighted by ppfx_cv_weight, edges rounded to 0.1 cm.
# Per-bin counts at 2.36124e20 POT: 86, 125, 104, 107, 97, 104. Widths span 0.3-0.9 cm.
# Why not finer: the reco lengths are quantised (148 distinct values below 3 cm, about 13 entries each), so from
# 8 bins up the bin heights alternate (51 next to 93, 50 next to 86) even though the bins are nominally equal-population.
# The earlier 0.5 cm minimum width would allow only 4 bins on this axis, which is too coarse.
#
# The sideband uses its own binning (leading_pion_length_sideband.toml), which is not changed here.
# Contained and exiting blocks below are NOT re-derived: they keep the old sideband-derived edges and
# are not usable in the signal selection (the exiting split holds ~1 event per bin).
#
# Widths are non-uniform, so these histograms MUST be drawn with per_bin_width = true.

[variables.reco_leading_primary_pion_length]
key = "reco_leading_primary_pion_length"
range = [0.0, 3.0]
nbins = 6
binning_scheme = 'custom_bins'
custom_bins = [0.0, 0.9, 1.4, 1.8, 2.2, 2.5, 3.0]
#range = [0, 3]
#nbins = 6
xlabel = '$L_\pi$ [cm] (Contained + Exiting $\pi^\pm$)'
xlabel_fontsize = 10

# --- Contained ---

[variables.reco_leading_primary_pion_length_contained]
key = "reco_leading_primary_pion_length"
range = [0.0, 10.0]
nbins = 24
binning_scheme = 'custom_bins'
custom_bins = [0.0, 4.7812, 6.7767, 8.7608, 11.02, 13.1366, 15.6584, 17.945, 20.6829, 23.1999, 26.3482, 29.4682, 32.9971, 36.7541, 40.9215, 45.4557, 50.7697, 56.6052, 63.4947, 71.9971, 81.8334, 94.469, 111.3103, 141.2853, 250.0]
#range = [0, 10]
#nbins = 10
xlabel = '$L_\pi$ [cm] (Contained $\mu^\pm$)'
xlabel_fontsize = 10
mask = 'reco_leading_primary_muon_containment == 1'

# --- Exiting ---

[variables.reco_leading_primary_pion_length_exiting]
key = "reco_leading_primary_pion_length"
range = [0.0, 10.0]
nbins = 24
binning_scheme = 'custom_bins'
custom_bins = [0.0, 4.7812, 6.7767, 8.7608, 11.02, 13.1366, 15.6584, 17.945, 20.6829, 23.1999, 26.3482, 29.4682, 32.9971, 36.7541, 40.9215, 45.4557, 50.7697, 56.6052, 63.4947, 71.9971, 81.8334, 94.469, 111.3103, 141.2853, 250.0]
#range = [0, 10]
#nbins = 10
xlabel = '$L_\pi$ [cm] (Exiting $\mu^\pm$)'
xlabel_fontsize = 10
mask = 'reco_leading_primary_muon_containment == 0'
