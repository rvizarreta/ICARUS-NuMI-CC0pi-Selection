# leading_pion_length binning (auto-generated by
# technote/signal_pion_length_binning.py). RECO HISTOGRAMS ONLY.
#
# RE-DERIVED FROM THE SIGNAL SELECTION, COMBINED SAMPLE ONLY.
# Earlier versions of this file were derived from the sideband tree
# because at the time the signal selection had only 5.9% of events
# (5842 entries at full POT) with a leading pion candidate at all,
# against 34420 in the sideband. That remains true here: this block
# is thin (76 events/bin at full POT, ~8/bin at 10% exposure) but
# usable. The exiting split is NOT usable at any reasonable bin
# count - only 105 signal-region events at full POT, ~1/bin - and
# is left on its prior (sideband-derived) binning, along with the
# contained split, which was not separately re-derived here. The
# sideband-tuned version of the full file is preserved unchanged at
# configurations/common/leading_pion_length_sideband.toml, wired
# into the sideband analysis directory.
#
# CRITERION: EQUAL-POPULATION, 24 bins, weighted by ppfx_cv_weight,
# sized at full POT 2.36124e+20 (MC POT 7.17839e+20).
#
#   reco_leading_pion_length: 24 bins, 76 events/bin at full POT, widths 0.1189 to 217.9 (ratio 1833), 5.90% of the sample in range
#
# NOT re-derived, left on their existing (sideband-derived) binning:
# reco_leading_pion_length_contained, reco_leading_pion_length_exiting
#
# Widths are strongly non-uniform, so these histograms MUST be drawn with
# per_bin_width = true or the shape is meaningless.
[variables.reco_leading_pion_length]
key = "reco_leading_pion_length"
range = [0.0, 250.0]
nbins = 19
binning_scheme = 'custom_bins'
custom_bins = [0.0, 0.8485, 1.0817, 1.3077, 1.5297, 1.7234, 1.9209, 2.0398, 2.245, 2.4372, 2.6324, 2.8302, 3.1464, 3.735, 4.3916, 5.4725, 6.3363, 7.4861, 8.8927, 10.86]
#range = [0, 10]
#nbins = 10
xlabel = '$L_\pi$ [cm] (Contained + Exiting $\pi^\pm$)'
xlabel_fontsize = 10

