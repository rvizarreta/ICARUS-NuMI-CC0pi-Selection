key = "reco_vertex_y"
range = [-200, 200]
nbins = 50
xlabel = 'Reco Vertex Y [cm] (Contained $\mu^\pm$)'
xlabel_fontsize = 10
mask = 'reco_leading_muon_containment == 1'

