# --- Combined (Contained + Exiting muons) ---

[variables.reco_vertex_y]
key = "reco_vertex_y"
range = [-200, 200]
nbins = 50
xlabel = 'Reco Vertex Y [cm] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.reco_vertex_y_residual]
key = "reco_vertex_y"
range = [-200, 200]
nbins = 200
xlabel = 'Reco Vertex Y [cm]'

[variables.true_vertex_y_residual]
key = "true_vertex_y"
range = [-200, 200]
nbins = 200
xlabel = 'True Vertex Y [cm]'

[variables.reco_vertex_y_smearing]
key = "reco_vertex_y"
range = [-200, 200]
nbins = 10
xlabel = 'Reco Vertex Y [cm] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.true_vertex_y_smearing]
key = "true_vertex_y"
range = [-200, 200]
nbins = 10
xlabel = 'True Vertex Y [cm] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

# --- Contained muon ---

