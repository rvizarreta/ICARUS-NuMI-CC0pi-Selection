[[this_includes]]
file = '../../../configurations/common/dalphaT.toml'

[[this_includes]]
file = '../../../configurations/common/styles.toml'

[variables.abs_dalphaT_residual]
key = "abs_dalphaT_residual"
range = [-90, 90]
nbins = 50
xlabel = '$\delta_{\alpha T,\mathrm{reco}} - \delta_{\alpha T,\mathrm{true}}$ [degrees] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.abs_dalphaT_residual_contained]
key = "abs_dalphaT_residual"
range = [-90, 90]
nbins = 50
xlabel = '$\delta_{\alpha T,\mathrm{reco}} - \delta_{\alpha T,\mathrm{true}}$ [degrees] (Contained $\mu^\pm$)'
xlabel_fontsize = 10
mask = 'reco_leading_muon_containment == 1'

[variables.abs_dalphaT_residual_exiting]
key = "abs_dalphaT_residual"
range = [-90, 90]
nbins = 50
xlabel = '$\delta_{\alpha T,\mathrm{reco}} - \delta_{\alpha T,\mathrm{true}}$ [degrees] (Exiting $\mu^\pm$)'
xlabel_fontsize = 10
mask = 'reco_leading_muon_containment == 0'

# SIMULATION SAMPLE
[samples]
[samples.mc]
#key = "nominal"
key = "full"
exposure_type = "pot"
override_exposure = 7.178390e20 # CORRECTED POT
trees = ['sideband']
print_sys = true
# Comment this to avoid systematics when plotting (usually done for testing plots)
systematics = ['sideband_variationTree', 'sideband_multisigmaTree', 'sideband_NuMIfluxsimTree']

[samples.mc.precompute]
abs_dalphaT_residual = "reco_dalphaT_deg - true_dalphaT_deg"

[samples.mc_nonmatched]
key = "full"
exposure_type = "pot"
override_exposure = 7.178390e20 # CORRECTED POT
trees = ['sideband_nonmatched']

[samples.mc_nonmatched.precompute]
abs_dalphaT_residual = "reco_dalphaT_deg - true_dalphaT_deg"

# DATA SAMPLE
[samples.onbeam]
key = "onbeam"
exposure_type = "pot"
override_exposure = 2.36124e19 # CORRECTED POT
override_category = -100
trees = ['sideband']

[samples.onbeam.precompute]
abs_dalphaT_residual = "reco_dalphaT_deg - reco_dalphaT_deg"

[samples.offbeam]
key = "offbeam"
exposure_type = "livetime"
override_category = 11
trees = ['sideband']

[samples.offbeam.precompute]
abs_dalphaT_residual = "reco_dalphaT_deg - reco_dalphaT_deg"


# ROCK MUON SAMPLE (merged into 'Others' category with cosmics)
[samples.rock]
key = "rock"
exposure_type = "pot"
override_category = 11
trees = ['selected']

[samples.rock.precompute]
abs_dalphaT_residual = "reco_dalphaT_deg - true_dalphaT_deg"

[output]
path = '.'

[[systematic_recipe]]
name = 'stats'
label = 'Stat.'
pattern = 'mc_statistical'

[[systematic_recipe]]
name = 'flux'
label = 'Flux'
pattern = 'hysyst*(?!\w*sigma\b)\w+\b'

[[systematic_recipe]]
name = 'xsec'
label = 'Cross-section'
#pattern = '\bGENIEReWeight_SBN_v1_multisigma_\w+\b'
pattern = '\bGENIEReWeight_SBN_v1_multisigma_\w+\b'

[[systematic_recipe]]
name = 'detsys'
label = 'Detector Systematics'
#pattern = '\bvar(00|01|02|03|04|05|06|07)\b'
pattern = '\bvar(01|02|03|04|05|06|07|08|09)\b'

[[systematic_recipe]]
name = 'MC_total'
label = 'All Systematics (No G4)'
pattern = '^(flux|xsec|stats|detsys)$'

[analysis]
#ordinate_sample = 'mc'
ordinate_sample = 'onbeam'
category_branch = 'true_category'
category_assignment = [[0], [1], [2], [4], [5,6,7], [8], [3], [11], [-100]]
category_labels = ['$\nu_\mu$CC0$\pi$ QE', '$\nu_\mu$CC0$\pi$ 2p2h', '$\nu_\mu$CC0$\pi$ $\pi$ abs.', '$\nu_\mu$CC1$\pi^\pm$', 'Other CC', '$\nu$ NC', '$\nu_\mu$CC0$\pi$ OOFV', 'Others', 'Data']
#category_colors = ['darkgreen', 'darkgreen','C1', 'C3','C5', 'C4', 'black']
category_colors = ['#003087', '#4A7CC7', '#9DC3F7', '#FF8C00', '#FFD100', '#CC0000', '#2E8B57', '#FF69B4', 'black']
category_types = ['histogram', 'histogram', 'histogram', 'histogram', 'histogram','histogram','histogram', 'histogram', 'scatter']

[[figure]]
name = 'dalphaT_reco'
type = 'SimpleFigure'
style = 'selected_sideband_icarus_data'
figsize = [5, 6]
[[figure.artists]]
type = 'SpineSpectra1D'
variable = 'reco_dalphaT'
yrange = 1.6
draw_kwargs = {'show_component_number' = true, 'show_component_percentage' = true, 'invert_stack_order' = true, 'normalize' = false, 'draw_error' = 'MC_total', 'draw_ratio'='True'}

# MC-only version of the combined reco distribution: no data points, no Data/MC
# ratio panel. Uses the 'selected_icarus_mc' style so the header reads
# "Simulation" rather than "Data (10% Run 2)". Always the merged sample.
[[figure]]
name = 'dalphaT_reco_mc_only'
type = 'SimpleFigure'
style = 'selected_icarus_mc'
figsize = [5, 5]
[[figure.artists]]
type = 'SpineSpectra1D'
variable = 'reco_dalphaT'
yrange = 1.6
draw_kwargs = {'show_component_number' = true, 'show_component_percentage' = true, 'invert_stack_order' = true, 'normalize' = false, 'draw_error' = 'MC_total', 'draw_data' = false}
[[figure]]
name = 'dalphaT_reco_contained'
