type = 'SimpleFigure'
style = 'selected_sideband_icarus_mc'
figsize = [5, 4]
[[figure.artists]]
type = 'SpineSpectra2D'
yvariable = 'reco_leading_muon_momentum_residual'
xvariable = 'true_leading_muon_momentum_residual'
xrange = [-1, 1]
xtitle = '$\frac{p_{\mu,\mathrm{reco}} - p_{\mu,\mathrm{true}}}{p_{\mu,\mathrm{true}}}$ (Contained + Exiting $\mu^\pm$)'
