[[this_includes]]
file = '../../../configurations/common/leading_muon_momentum.toml'

[[this_includes]]
file = '../../../configurations/common/styles.toml'

[variables.abs_leading_muon_momentum_residual]
key = "abs_leading_muon_momentum_residual"
range = [-1.5, 1.5]
nbins = 50
xlabel = '$p_{\mu,\mathrm{reco}} - p_{\mu,\mathrm{true}}$ [GeV/c] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.abs_leading_muon_momentum_residual_contained]
key = "abs_leading_muon_momentum_residual"
range = [-1.5, 1.5]
nbins = 50
xlabel = '$p_{\mu,\mathrm{reco}} - p_{\mu,\mathrm{true}}$ [GeV/c] (Contained $\mu^\pm$)'
xlabel_fontsize = 10
mask = 'reco_leading_muon_containment == 1'

[variables.abs_leading_muon_momentum_residual_exiting]
key = "abs_leading_muon_momentum_residual"
range = [-1.5, 1.5]
nbins = 50
xlabel = '$p_{\mu,\mathrm{reco}} - p_{\mu,\mathrm{true}}$ [GeV/c] (Exiting $\mu^\pm$)'
xlabel_fontsize = 10
mask = 'reco_leading_muon_containment == 0'

# SIMULATION SAMPLE
[samples]
[samples.mc]
key = "full"
exposure_type = "pot"
override_exposure = 7.178390e20 # CORRECTED POT
trees = ['sideband']
print_sys = true
systematics = ['sideband_variationTree', 'sideband_multisigmaTree', 'sideband_NuMIfluxsimTree']

[samples.mc.precompute]
abs_leading_muon_momentum_residual = "reco_leading_muon_momentum - true_leading_muon_momentum"

[samples.mc_nonmatched]
key = "full"
exposure_type = "pot"
override_exposure = 7.178390e20 # CORRECTED POT
trees = ['sideband_nonmatched']

[samples.mc_nonmatched.precompute]
abs_leading_muon_momentum_residual = "reco_leading_muon_momentum - true_leading_muon_momentum"

# DATA SAMPLE
[samples.onbeam]
key = "onbeam"
exposure_type = "pot"
override_exposure = 2.36124e19 # CORRECTED POT
override_category = -100
trees = ['sideband']

[samples.onbeam.precompute]
abs_leading_muon_momentum_residual = "reco_leading_muon_momentum - reco_leading_muon_momentum"

[samples.offbeam]
key = "offbeam"
exposure_type = "livetime"
override_category = 11
trees = ['sideband']

[samples.offbeam.precompute]
abs_leading_muon_momentum_residual = "reco_leading_muon_momentum - reco_leading_muon_momentum"


# ROCK MUON SAMPLE (merged into 'Others' category with cosmics)
[samples.rock]
key = "rock"
exposure_type = "pot"
override_category = 11
trees = ['selected']

[samples.rock.precompute]
abs_leading_muon_momentum_residual = "reco_leading_muon_momentum - true_leading_muon_momentum"

[output]
path = '.'

[[systematic_recipe]]
name = 'stats'
label = 'Stat.'
pattern = 'mc_statistical'

[[systematic_recipe]]
name = 'flux'
label = 'Flux'
pattern = 'hysyst*(?!\w*sigma\b)\w+\b'

[[systematic_recipe]]
name = 'xsec'
label = 'Cross-section'
pattern = '\bGENIEReWeight_SBN_v1_multisigma_\w+\b'

[[systematic_recipe]]
name = 'detsys'
label = 'Detector Systematics'
pattern = '\bvar(01|02|03|04|05|06|07|08|09)\b'

[[systematic_recipe]]
name = 'MC_total'
label = 'All Systematics (No G4)'
pattern = '^(flux|xsec|stats|detsys)$'

[analysis]
ordinate_sample = 'onbeam'
category_branch = 'true_category'
category_assignment = [[0,3,1,4], [6], [7,8,9], [10], [2,5], [11], [-100]]
category_labels = ['Signal $\nu_\mu$CC0$\pi^\pm$', '$\nu_\mu$CC1$\pi^\pm$', 'Other CC', '$\nu$NC', 'OOFV', 'Others', 'Data']
category_colors = ['#003087', '#FF8C00', '#FFD100', '#CC0000', '#2E8B57', '#FF69B4', 'black']
category_types = ['histogram', 'histogram', 'histogram', 'histogram','histogram','histogram', 'scatter']

# --- Reco distribution ---

[[figure]]
name = 'leading_muon_momentum_reco'
type = 'SimpleFigure'
style = 'selected_sideband_icarus_data'
figsize = [5, 5]
[[figure.artists]]
type = 'SpineSpectra1D'
variable = 'reco_leading_muon_momentum'
yrange = 1.6
draw_kwargs = {'show_component_number' = true, 'show_component_percentage' = true, 'invert_stack_order' = true, 'normalize' = false, 'draw_error' = 'MC_total', 'draw_ratio' = 'True'}

[[figure]]
name = 'leading_muon_momentum_reco_contained'
type = 'SimpleFigure'
style = 'selected_sideband_icarus_data'
figsize = [5, 5]
[[figure.artists]]
type = 'SpineSpectra1D'
variable = 'reco_leading_muon_momentum_contained'
yrange = 1.6
draw_kwargs = {'show_component_number' = true, 'show_component_percentage' = true, 'invert_stack_order' = true, 'normalize' = false, 'draw_error' = 'MC_total', 'draw_ratio' = 'True'}

[[figure]]
name = 'leading_muon_momentum_reco_exiting'
type = 'SimpleFigure'
style = 'selected_sideband_icarus_data'
figsize = [5, 5]
[[figure.artists]]
