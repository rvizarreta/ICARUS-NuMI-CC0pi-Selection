# ROCK MUON SAMPLE (merged into 'Others' category with cosmics)
[samples.rock]
key = "rock"
exposure_type = "pot"
override_category = 11
trees = ['sideband']
# Rock-vs-cosmic angular cut (Cos theta_LTYD), same definition as Preselection.ipynb
presel = 'reco_longest_track_start_dir_y / sqrt(reco_longest_track_start_dir_x**2 + reco_longest_track_start_dir_y**2 + reco_longest_track_start_dir_z**2) > 0.06'

[samples.rock.precompute]
# Same MC-only correction as [samples.mc.precompute].
vtx_x_shift = "0.327 + 0.1573 * reco_flash_time"
vtx_x_true_same_cryo = "(true_vertex_x * reco_vertex_x) > 0"
vtx_x_outer_tpc = "(vtx_x_true_same_cryo & (abs(true_vertex_x) > 210.215)) | (~vtx_x_true_same_cryo & (abs(reco_vertex_x) > 210.215))"
reco_vertex_x = "reco_vertex_x / abs(reco_vertex_x) * (abs(reco_vertex_x) + vtx_x_shift * (2 * vtx_x_outer_tpc - 1))"
abs_vertex_x_residual = "reco_vertex_x - true_vertex_x"

