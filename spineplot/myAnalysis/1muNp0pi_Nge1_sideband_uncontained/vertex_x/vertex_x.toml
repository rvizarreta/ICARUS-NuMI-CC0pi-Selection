# SIMULATION SAMPLE
[samples]
[samples.mc]
key = "full"
exposure_type = "pot"
override_exposure = 7.095833928884415e+20 # CORRECTED POT
trees = ['sideband']
print_sys = true
systematics = ['sideband_variationTree', 'sideband_multisigmaTree', 'sideband_NuMIfluxsimTree']

[samples.mc.precompute]
# MC-only cathode correction of the reco vertex x (2026-11-26), same as the signal-selection vertex_x.toml (option D).
# PROBLEM: in MC the reconstructed x of the whole event is displaced toward the cathode (|x| = 210.215 cm) by
#   s(t) = 0.327 + 0.1573 * reco_flash_time cm (fit on the signal selection); reco events from the two TPCs overlap at the
#   plane (spike). Data shows no shift.
# CORRECTION (MC only, no events removed):
#   d_corr = d_reco + s(t) * sign(d_true),  d = |x| - 210.215 cm,  sign of x kept.
#   sign(d_true) = +1 if the TRUE vertex is in the outer TPC, -1 if inner; if there is no true vertex in the same cryostat,
#   the TPC where reco put it is used.                                                   -> vtx_x_outer_tpc
#   Equivalent form used below: |x_corr| = |x_reco| + s(t) * (2 * vtx_x_outer_tpc - 1).
# SIDEBAND CHECK (data/cathode_study/sideband_shift_check.py, events/full/sideband): the same shift is there, median 1.086 cm,
#   fit 0.346 + 0.1539 t (signal selection: 0.327 + 0.1573 t); after this correction the bulk median is +0.003 cm.
#   Events within +-5 cm of the cathode vs flat (R): data 0.968 +- 0.053, MC uncorrected 1.088, corrected 0.887, MC true x 0.937.
# Data and off-beam are not corrected. Order matters: abs_vertex_x_residual uses the corrected x.
vtx_x_shift = "0.327 + 0.1573 * reco_flash_time"
vtx_x_true_same_cryo = "(true_vertex_x * reco_vertex_x) > 0"
vtx_x_outer_tpc = "(vtx_x_true_same_cryo & (abs(true_vertex_x) > 210.215)) | (~vtx_x_true_same_cryo & (abs(reco_vertex_x) > 210.215))"
reco_vertex_x = "reco_vertex_x / abs(reco_vertex_x) * (abs(reco_vertex_x) + vtx_x_shift * (2 * vtx_x_outer_tpc - 1))"
abs_vertex_x_residual = "reco_vertex_x - true_vertex_x"

[samples.mc.interaction_method]
method = 'truth'  # McFarland 'response' method disabled 2026-10-25
pattern = 'GENIEReWeight'
truth_tree = 'signal'
truth_systematics_tree = 'signal_multisigmaTree'
truth_variable = 'true_vertex_x'
truth_bin_edges = [-337.0, -312.0, -287.0, -262.0, -237.0, -212.0, -187.0, -162.0, -137.0, -112.0, -87.0, 87.0, 112.0, 137.0, 162.0, 187.0, 212.0, 237.0, 262.0, 287.0, 312.0, 337.0]
signal_mask = '(true_category == 0 or true_category == 1 or true_category == 2)'
nuniv = 1000
seed = 0

