[variables.abs_dpTT_lp_residual]
key = "abs_dpTT_lp_residual"
range = [-600, 600]
nbins = 50
xlabel = '$\delta_{pTT,\mathrm{reco}} - \delta_{pTT,\mathrm{true}}$ [MeV/c] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.abs_dpTT_lp_residual_contained]
key = "abs_dpTT_lp_residual"
range = [-600, 600]
nbins = 50
xlabel = '$\delta_{pTT,\mathrm{reco}} - \delta_{pTT,\mathrm{true}}$ [MeV/c] (Contained $\mu^\pm$)'
xlabel_fontsize = 10
mask = 'reco_leading_muon_containment == 1'

[variables.abs_dpTT_lp_residual_exiting]
key = "abs_dpTT_lp_residual"
range = [-600, 600]
nbins = 50
