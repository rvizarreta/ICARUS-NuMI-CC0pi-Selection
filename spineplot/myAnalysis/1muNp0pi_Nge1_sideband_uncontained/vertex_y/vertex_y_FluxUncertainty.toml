[[this_includes]]
file = '../../../configurations/common/vertex_y.toml'

[[this_includes]]
file = '../../../configurations/common/styles.toml'

[samples]
[samples.mc]
key = "full"
exposure_type = "pot"
trees = ['sideband']
print_sys = true
systematics = ['sideband_NuMIfluxsimTree']

[samples.mc_nonmatched]
key = "full"
exposure_type = "pot"
trees = ['sideband_nonmatched']

[samples.onbeam]
key = "onbeam"
exposure_type = "pot"
override_exposure = 2.36124e19
override_category = -100
trees = ['sideband']

[samples.offbeam]
key = "offbeam"
exposure_type = "livetime"
override_category = 10
trees = ['sideband']

[output]
path = '.'

[[systematic_recipe]]
name = 'beam_focusing'
label = 'Beam Focusing'
pattern = 'hysyst_(horn_current|horn1_x|horn1_y|beam_spot|horn_water|beam_shift_x|beam_shift_y|target_to_horn1|decay_pipe_radius|beam_divergence|beam_momentum)(?!\w*sigma\b)\w*\b'

[[systematic_recipe]]
name = 'hadron_prod'
label = 'Hadron Production'
pattern = 'hysyst_hpc_\d+(?!\w*sigma\b)\w*\b'

[analysis]
ordinate_sample = 'onbeam'
category_branch = 'true_category'
category_assignment = [[0,3,1,4], [6,7,8], [9], [2,5], [10], [-100]]
category_labels = ['Signal', 'Other CC', '$\nu$ NC', 'OOFV', 'Cosmic', 'Data']
category_colors = ['#003087', '#FFD100', '#CC0000', '#2E8B57', '#FF69B4', 'black']
category_types = ['histogram', 'histogram', 'histogram', 'histogram', 'histogram', 'scatter']

[[figure]]
name = 'vertex_y_FluxUncertainty'
type = 'SimpleFigure'
style = 'selected_sideband_icarus_mc'
figsize = [5, 4]
[[figure.artists]]
type = 'SpineSpectra1D'
variable = 'reco_vertex_y'
yrange = [0.0, 0.45]
[figure.artists.draw_kwargs]
method = 'draw_systematics'
systematic_names = ['beam_focusing', 'hadron_prod']
fractional = true
show_total = true
show_individual = true

[[figure]]
name = 'vertex_y_FluxUncertainty_contained'
type = 'SimpleFigure'
style = 'selected_sideband_icarus_mc'
figsize = [5, 4]
[[figure.artists]]
type = 'SpineSpectra1D'
variable = 'reco_vertex_y_contained'
yrange = [0.0, 0.45]
[figure.artists.draw_kwargs]
method = 'draw_systematics'
systematic_names = ['beam_focusing', 'hadron_prod']
fractional = true
show_total = true
show_individual = true

[[figure]]
name = 'vertex_y_FluxUncertainty_exiting'
type = 'SimpleFigure'
style = 'selected_sideband_icarus_mc'
figsize = [5, 4]
[[figure.artists]]
type = 'SpineSpectra1D'
variable = 'reco_vertex_y_exiting'
yrange = [0.0, 0.45]
[figure.artists.draw_kwargs]
method = 'draw_systematics'
systematic_names = ['beam_focusing', 'hadron_prod']
fractional = true
show_total = true
show_individual = true
