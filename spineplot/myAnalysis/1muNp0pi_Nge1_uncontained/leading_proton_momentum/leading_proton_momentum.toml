# SIMULATION SAMPLE
[samples]
[samples.mc]
key = "full"
exposure_type = "pot"
override_exposure = 7.178390e20 # CORRECTED POT
trees = ['selected']
print_sys = true
systematics = ['selected_variationTree', 'selected_multisigmaTree', 'selected_NuMIfluxsimTree']

[samples.mc.precompute]
abs_leading_proton_momentum_residual = "reco_leading_proton_momentum - true_leading_proton_momentum"

# --- Interaction-dial systematic method -------------------------------
# 'truth'    : dial reweights selected events directly (original behaviour).
#              This is the defensible band for a data/MC comparison, since
#              the prediction really does depend on GENIE's rate.
# 'response' : each SIGNAL event's dial weight is divided by the change in
#              the population of its true bin, so a pure normalisation
#              change cancels and only shape / efficiency / migration
#              effects survive. Matches what the cross-section fit
#              actually absorbs via the free template parameters.
# Only dials matching `pattern` are affected: flux (hysyst_*) and detector
# (var0*) dials keep the original treatment either way.
# truth_bin_edges is the combined equal-population truth binning derived by
# technote/proton_momentum_combined_binning.py (overflow bin included, since
# [0.31, 1.2] is a reconstruction cut, not a physical bound - same reasoning
# as dpT).
[samples.mc.interaction_method]
method = 'response'
pattern = 'GENIEReWeight'
truth_tree = 'signal'
truth_systematics_tree = 'signal_multisigmaTree'
truth_variable = 'true_leading_proton_momentum'
truth_bin_edges = [0.31, 0.3927, 0.4571, 0.5239, 0.5934, 0.6689, 0.762, 0.9018, 1.2, 10000000.0]
signal_mask = '(true_category == 0 or true_category == 1 or true_category == 2)'
nuniv = 1000
seed = 0

# GEANT4 hadron-reinteraction (fate) systematics: fractional covariances from the GUNDAM
# G4 ParameterSets, applied to this sample's bin contents. Contained and exiting only;
# the combined variable has no G4 matrix and gets zero contribution.
[[samples.mc.external_covariances]]
name = 'G4_proton'
label = 'G4 proton'
[samples.mc.external_covariances.files]
reco_leading_proton_momentum_contained = '/exp/icarus/app/users/rvizarr/gundam-icarus/configs/Configs_ParameterSet/G4/outputs/output_CovMat_G4Proton_leading_proton_momentum_contained.root'
reco_leading_proton_momentum_exiting = '/exp/icarus/app/users/rvizarr/gundam-icarus/configs/Configs_ParameterSet/G4/outputs/output_CovMat_G4Proton_leading_proton_momentum_exiting.root'
[samples.mc.external_covariances.binning_files]
reco_leading_proton_momentum_contained = '/exp/icarus/app/users/rvizarr/gundam-icarus/configs/binnings/binning_reco_leading_proton_momentum_contained.txt'
reco_leading_proton_momentum_exiting = '/exp/icarus/app/users/rvizarr/gundam-icarus/configs/binnings/binning_reco_leading_proton_momentum_exiting.txt'

[[samples.mc.external_covariances]]
