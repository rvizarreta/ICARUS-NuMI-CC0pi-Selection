# Combined (contained + exiting muons).
[[figure]]
name = "systematics_dpT_background"
type = "SimpleFigure"
style = 'selected_icarus_mc'
figsize = [5, 4]
[[figure.artists]]
type = "SpineSpectra1D"
variable = "reco_dpT"
yrange = [0.0, 0.45]
[figure.artists.draw_kwargs]
method = "draw_systematics"
systematic_names = ["detsys", "flux", "xsec", "stats"]
fractional = true
show_total = true
show_individual = true

[[figure]]
name = "systematics_dpT_background_contained"
type = "SimpleFigure"
