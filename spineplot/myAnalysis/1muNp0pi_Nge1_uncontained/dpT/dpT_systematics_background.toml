[[this_includes]]
file = '../../../configurations/common/dpT.toml'

[[this_includes]]
file = '../../../configurations/common/styles.toml'

# SIMULATION SAMPLE (background only: true_category in {2,5,6,7,8,9,10}, plus
# rock/cosmic events, which are 100% background by construction)
[samples]
[samples.mc]
key = "full"
exposure_type = "pot"
override_exposure = 7.178390e20 # CORRECTED POT
trees = ['selected']
print_sys = true
presel = 'true_category == 2 or true_category == 5 or true_category == 6 or true_category == 7 or true_category == 8 or true_category == 9 or true_category == 10'
systematics = ['selected_variationTree', 'selected_multisigmaTree', 'selected_NuMIfluxsimTree']

[samples.mc.precompute]
abs_dpT_residual = "reco_dpT_lp - true_dpT_lp_genie"

[samples.mc_nonmatched]
key = "full"
exposure_type = "pot"
override_exposure = 7.178390e20 # CORRECTED POT
trees = ['selected_nonmatched']
presel = 'true_category == 2 or true_category == 5 or true_category == 6 or true_category == 7 or true_category == 8 or true_category == 9 or true_category == 10'

[samples.mc_nonmatched.precompute]
abs_dpT_residual = "reco_dpT_lp - true_dpT_lp_genie"

# ROCK MUON SAMPLE (cosmic/rock, merged into 'Others' category; already 100%
# background so no presel is needed)
[samples.rock]
key = "rock"
exposure_type = "pot"
override_category = 11
trees = ['selected']

[samples.rock.precompute]
abs_dpT_residual = "reco_dpT_lp - true_dpT_lp_genie"

# DATA SAMPLE (used only as the exposure-normalization target; not drawn)
[samples.onbeam]
key = "onbeam"
exposure_type = "pot"
override_exposure = 2.36124e19 # CORRECTED POT
override_category = -100
trees = ['selected']

[samples.onbeam.precompute]
abs_dpT_residual = "reco_dpT_lp - reco_dpT_lp"

[output]
path = '.'

[[systematic_recipe]]
name = 'stats'
label = 'Stat.'
pattern = 'mc_statistical'

[[systematic_recipe]]
name = 'flux'
label = 'Flux'
pattern = 'hysyst*(?!\w*sigma\b)\w+\b'

[[systematic_recipe]]
name = 'xsec'
label = 'Cross-section'
pattern = '\bGENIEReWeight_SBN_v1_multisigma_\w+\b'

[[systematic_recipe]]
name = 'detsys'
label = 'Detector Systematics'
pattern = '\bvar(01|02|03|04|05|06|07|08|09)\b'

[[systematic_recipe]]
name = 'MC_total'
label = 'All Systematics'
pattern = '^(flux|xsec|stats|detsys)$'

[analysis]
ordinate_sample = 'onbeam'
category_branch = 'true_category'
category_assignment = [[4], [5,6,7], [8], [3], [11]]
category_labels = ['$\nu_\mu$CC1$\pi^\pm$', 'Other CC', '$\nu$ NC', 'OOFV', 'Others']
category_colors = ['#FF8C00', '#FFD100', '#CC0000', '#2E8B57', '#FF69B4']
category_types = ['histogram', 'histogram', 'histogram', 'histogram', 'histogram']

