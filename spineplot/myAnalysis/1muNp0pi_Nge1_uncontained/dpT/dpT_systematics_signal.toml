[[this_includes]]
file = '../../../configurations/common/dpT.toml'

[[this_includes]]
file = '../../../configurations/common/styles.toml'

# SIMULATION SAMPLE (signal only: true_category in {0,1,3,4})
[samples]
[samples.mc]
key = "full"
exposure_type = "pot"
override_exposure = 7.178390e20 # CORRECTED POT
trees = ['selected']
print_sys = true
presel = 'true_category == 0 or true_category == 1 or true_category == 3 or true_category == 4'
systematics = ['selected_variationTree', 'selected_multisigmaTree', 'selected_NuMIfluxsimTree']

[samples.mc.precompute]
abs_dpT_residual = "reco_dpT_lp - true_dpT_lp_genie"

[samples.mc_nonmatched]
key = "full"
exposure_type = "pot"
override_exposure = 7.178390e20 # CORRECTED POT
trees = ['selected_nonmatched']
presel = 'true_category == 0 or true_category == 1 or true_category == 3 or true_category == 4'

[samples.mc_nonmatched.precompute]
abs_dpT_residual = "reco_dpT_lp - true_dpT_lp_genie"

# DATA SAMPLE (used only as the exposure-normalization target; not drawn)
[samples.onbeam]
key = "onbeam"
exposure_type = "pot"
override_exposure = 2.36124e19 # CORRECTED POT
override_category = -100
trees = ['selected']

[samples.onbeam.precompute]
abs_dpT_residual = "reco_dpT_lp - reco_dpT_lp"

[output]
path = '.'

[[systematic_recipe]]
name = 'stats'
label = 'Stat.'
pattern = 'mc_statistical'

[[systematic_recipe]]
name = 'flux'
label = 'Flux'
pattern = 'hysyst*(?!\w*sigma\b)\w+\b'

[[systematic_recipe]]
name = 'xsec'
label = 'Cross-section'
pattern = '\bGENIEReWeight_SBN_v1_multisigma_\w+\b'

[[systematic_recipe]]
name = 'detsys'
label = 'Detector Systematics'
pattern = '\bvar(01|02|03|04|05|06|07|08|09)\b'

[[systematic_recipe]]
name = 'MC_total'
label = 'All Systematics'
pattern = '^(flux|xsec|stats|detsys)$'

[analysis]
ordinate_sample = 'onbeam'
category_branch = 'true_category'
category_assignment = [[0], [1], [2]]
category_labels = ['$\nu_\mu$CC0$\pi$ QE', '$\nu_\mu$CC0$\pi$ 2p2h', '$\nu_\mu$CC0$\pi$ $\pi$ abs.']
category_colors = ['#003087', '#4A7CC7', '#9DC3F7']
category_types = ['histogram', 'histogram', 'histogram']

