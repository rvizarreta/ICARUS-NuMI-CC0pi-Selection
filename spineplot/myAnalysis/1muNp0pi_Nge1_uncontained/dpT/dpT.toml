[[this_includes]]
#file = '../configurations/common/variables_uncontained.toml'
file = '../../../configurations/common/dpT.toml'

[[this_includes]]
file = '../../../configurations/common/styles.toml'

[variables.abs_dpT_residual]
key = "abs_dpT_residual"
range = [-600, 600]
nbins = 50
xlabel = '$\delta_{pT,\mathrm{reco}} - \delta_{pT,\mathrm{true}}$ [MeV/c] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.abs_dpT_residual_contained]
key = "abs_dpT_residual"
range = [-600, 600]
nbins = 50
xlabel = '$\delta_{pT,\mathrm{reco}} - \delta_{pT,\mathrm{true}}$ [MeV/c] (Contained $\mu^\pm$)'
xlabel_fontsize = 10
mask = 'reco_leading_muon_containment == 1'

[variables.abs_dpT_residual_exiting]
key = "abs_dpT_residual"
range = [-600, 600]
nbins = 50
xlabel = '$\delta_{pT,\mathrm{reco}} - \delta_{pT,\mathrm{true}}$ [MeV/c] (Exiting $\mu^\pm$)'
xlabel_fontsize = 10
mask = 'reco_leading_muon_containment == 0'

# SIMULATION SAMPLE
[samples]
[samples.mc]
#key = "nominal"
key = "full"
exposure_type = "pot"
trees = ['selected']
print_sys = true
# Comment this to avoid systematics when plotting (usually done for testing plots)
systematics = ['selected_variationTree', 'selected_multisigmaTree', 'selected_NuMIfluxsimTree']
#systematics = ['selected_NuMIfluxsimTree']

[samples.mc.precompute]
abs_dpT_residual = "reco_dpT_lp - true_dpT_lp_genie"

[samples.mc_nonmatched]
key = "full"
exposure_type = "pot"
trees = ['selected_nonmatched']

[samples.mc_nonmatched.precompute]
abs_dpT_residual = "reco_dpT_lp - true_dpT_lp_genie"

# DATA SAMPLE
[samples.onbeam]
key = "onbeam"
exposure_type = "pot"
override_exposure = 2.36124e19 # CORRECTED POT
override_category = -100
trees = ['selected']

[samples.onbeam.precompute]
abs_dpT_residual = "reco_dpT_lp - reco_dpT_lp"

[samples.offbeam]
key = "offbeam"
exposure_type = "livetime"
override_category = 10
trees = ['selected']

[samples.offbeam.precompute]
abs_dpT_residual = "reco_dpT_lp - reco_dpT_lp"

[output]
path = '.'

[[systematic_recipe]]
name = 'stats'
label = 'Stat.'
pattern = 'mc_statistical'

[[systematic_recipe]]
name = 'flux'
label = 'Flux'
pattern = 'hysyst*(?!\w*sigma\b)\w+\b'

[[systematic_recipe]]
name = 'xsec'
label = 'Cross-section'
#pattern = '\bGENIEReWeight_SBN_v1_multisim_\w+\b'
pattern = '\bGENIEReWeight_SBN_v1_multisigma_\w+\b'

[[systematic_recipe]]
name = 'detsys'
label = 'Detector Systematics'
#pattern = '\bvar(00|01|02|03|04|05|06|07)\b'
pattern = '\bvar(01|02|03|04|05|06|07|08|09)\b'

[[systematic_recipe]]
name = 'MC_total'
label = 'All Systematics (No G4)'
pattern = '^(flux|xsec|stats|detsys)$'

[analysis]
#ordinate_sample = 'mc'
ordinate_sample = 'onbeam'
category_branch = 'true_category'
category_assignment = [[0,3], [1,4], [6,7,8], [9], [2,5], [10], [-100]]
category_labels = ['Signal', 'Signal QE', 'Other CC', '$\nu$ NC', 'OOFV', 'Cosmic', 'Data']
#category_colors = ['darkgreen', 'darkgreen','C1', 'C3','C5', 'C4', 'black']
category_colors = ['#003087', '#003087', '#FFD100', '#CC0000', '#2E8B57', '#FF69B4', 'black']
category_types = ['histogram', 'histogram', 'histogram', 'histogram','histogram','histogram', 'scatter']

[[figure]]
name = 'dpT_reco'
type = 'SimpleFigure'
style = 'selected_icarus_data'
figsize = [5, 5]
[[figure.artists]]
type = 'SpineSpectra1D'
variable = 'reco_dpT'
yrange = 1.5
draw_kwargs = {'show_component_number' = true, 'show_component_percentage' = true, 'invert_stack_order' = true, 'normalize' = false, 'draw_error' = 'MC_total', 'draw_ratio'='True'}

[[figure]]
name = 'dpT_reco_contained'
type = 'SimpleFigure'
style = 'selected_icarus_data'
figsize = [5, 5]
[[figure.artists]]
