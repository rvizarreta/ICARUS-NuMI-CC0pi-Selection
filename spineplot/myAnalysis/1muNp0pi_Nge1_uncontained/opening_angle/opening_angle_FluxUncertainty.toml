[[this_includes]]
file = '../../../configurations/common/opening_angle.toml'

[[this_includes]]
file = '../../../configurations/common/styles.toml'

[samples]
[samples.mc]
key = "full"
exposure_type = "pot"
override_exposure = 7.178390e20 # CORRECTED POT
trees = ['selected']
print_sys = true
systematics = ['selected_NuMIfluxsimTree']

[samples.mc_nonmatched]
key = "full"
exposure_type = "pot"
override_exposure = 7.178390e20 # CORRECTED POT
trees = ['selected_nonmatched']

[samples.onbeam]
key = "onbeam"
exposure_type = "pot"
override_exposure = 2.36124e19
override_category = -100
trees = ['selected']

[samples.offbeam]
key = "offbeam"
exposure_type = "livetime"
override_category = 11
trees = ['selected']


# ROCK MUON SAMPLE (merged into 'Others' category with cosmics)
[samples.rock]
key = "rock"
exposure_type = "pot"
override_category = 11
trees = ['selected']

[output]
path = '.'

[[systematic_recipe]]
name = 'beam_focusing'
label = 'Beam Focusing'
pattern = 'hysyst_(horn_current|horn1_x|horn1_y|beam_spot|horn_water|beam_shift_x|beam_shift_y|target_to_horn1|decay_pipe_radius|beam_divergence|beam_momentum)(?!\w*sigma\b)\w*\b'

[[systematic_recipe]]
name = 'hadron_prod'
label = 'Hadron Production'
pattern = 'hysyst_hpc_\d+(?!\w*sigma\b)\w*\b'

[analysis]
ordinate_sample = 'onbeam'
category_branch = 'true_category'
category_assignment = [[0], [1], [2], [4], [5,6,7], [8], [3], [11], [-100]]
category_labels = ['$\nu_\mu$CC0$\pi$ QE', '$\nu_\mu$CC0$\pi$ 2p2h', '$\nu_\mu$CC0$\pi$ $\pi$ abs.', '$\nu_\mu$CC1$\pi^\pm$', 'Other CC', '$\nu$ NC', '$\nu_\mu$CC0$\pi$ OOFV', 'Others', 'Data']
category_colors = ['#003087', '#4A7CC7', '#9DC3F7', '#FF8C00', '#FFD100', '#CC0000', '#2E8B57', '#FF69B4', 'black']
category_types = ['histogram', 'histogram', 'histogram', 'histogram', 'histogram','histogram','histogram', 'histogram', 'scatter']

[[figure]]
name = 'opening_angle_FluxUncertainty'
type = 'SimpleFigure'
style = 'selected_icarus_mc'
figsize = [5, 4]
[[figure.artists]]
type = 'SpineSpectra1D'
variable = 'reco_opening_angle'
yrange = [0.0, 0.45]
[figure.artists.draw_kwargs]
method = 'draw_systematics'
systematic_names = ['beam_focusing', 'hadron_prod']
fractional = true
show_total = true
show_individual = true

[[figure]]
name = 'opening_angle_FluxUncertainty_contained'
type = 'SimpleFigure'
style = 'selected_icarus_mc'
figsize = [5, 4]
[[figure.artists]]
type = 'SpineSpectra1D'
variable = 'reco_opening_angle_contained'
yrange = [0.0, 0.45]
[figure.artists.draw_kwargs]
method = 'draw_systematics'
systematic_names = ['beam_focusing', 'hadron_prod']
fractional = true
show_total = true
show_individual = true

[[figure]]
name = 'opening_angle_FluxUncertainty_exiting'
type = 'SimpleFigure'
style = 'selected_icarus_mc'
figsize = [5, 4]
[[figure.artists]]
type = 'SpineSpectra1D'
variable = 'reco_opening_angle_exiting'
yrange = [0.0, 0.45]
[figure.artists.draw_kwargs]
method = 'draw_systematics'
systematic_names = ['beam_focusing', 'hadron_prod']
fractional = true
show_total = true
show_individual = true
