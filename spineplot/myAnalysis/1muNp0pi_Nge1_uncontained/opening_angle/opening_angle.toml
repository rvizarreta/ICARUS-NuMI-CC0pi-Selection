[[this_includes]]
file = '../../../configurations/common/opening_angle.toml'

[[this_includes]]
file = '../../../configurations/common/styles.toml'

[variables.abs_opening_angle_residual]
key = "abs_opening_angle_residual"
range = [-0.5, 0.5]
nbins = 50
xlabel = '$\cos(\theta_{\mu p,\mathrm{reco}}) - \cos(\theta_{\mu p,\mathrm{true}})$ (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.abs_opening_angle_residual_contained]
key = "abs_opening_angle_residual"
range = [-0.5, 0.5]
nbins = 50
xlabel = '$\cos(\theta_{\mu p,\mathrm{reco}}) - \cos(\theta_{\mu p,\mathrm{true}})$ (Contained $\mu^\pm$)'
xlabel_fontsize = 10
mask = 'reco_leading_muon_containment == 1'

[variables.abs_opening_angle_residual_exiting]
key = "abs_opening_angle_residual"
range = [-0.5, 0.5]
nbins = 50
xlabel = '$\cos(\theta_{\mu p,\mathrm{reco}}) - \cos(\theta_{\mu p,\mathrm{true}})$ (Exiting $\mu^\pm$)'
xlabel_fontsize = 10
mask = 'reco_leading_muon_containment == 0'

# Angle residual in degrees (reviewer request: theta rather than cos(theta),
# un-normalized difference rather than fractional)
[variables.theta_mup_residual_deg]
key = "theta_mup_residual_deg"
range = [-60.0, 60.0]
nbins = 60
xlabel = '$\theta_{\mu p}^{\mathrm{reco}} - \theta_{\mu p}^{\mathrm{true}}$ [deg] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.theta_mup_residual_deg_contained]
key = "theta_mup_residual_deg"
range = [-60.0, 60.0]
nbins = 60
xlabel = '$\theta_{\mu p}^{\mathrm{reco}} - \theta_{\mu p}^{\mathrm{true}}$ [deg] (Contained $\mu^\pm$)'
xlabel_fontsize = 10
mask = 'reco_leading_muon_containment == 1'

[variables.theta_mup_residual_deg_exiting]
key = "theta_mup_residual_deg"
range = [-60.0, 60.0]
nbins = 60
xlabel = '$\theta_{\mu p}^{\mathrm{reco}} - \theta_{\mu p}^{\mathrm{true}}$ [deg] (Exiting $\mu^\pm$)'
xlabel_fontsize = 10
mask = 'reco_leading_muon_containment == 0'

# SIMULATION SAMPLE
[samples]
[samples.mc]
key = "full"
exposure_type = "pot"
override_exposure = 7.178390e20 # CORRECTED POT
trees = ['selected']
print_sys = true
systematics = ['selected_variationTree', 'selected_multisigmaTree', 'selected_NuMIfluxsimTree']

[samples.mc.precompute]
abs_opening_angle_residual = "reco_opening_angle_cos - true_opening_angle_cos"
theta_mup_residual_deg = "reco_opening_angle_deg - true_opening_angle_deg"

[samples.mc_nonmatched]
key = "full"
exposure_type = "pot"
override_exposure = 7.178390e20 # CORRECTED POT
trees = ['selected_nonmatched']

[samples.mc_nonmatched.precompute]
abs_opening_angle_residual = "reco_opening_angle_cos - true_opening_angle_cos"
theta_mup_residual_deg = "reco_opening_angle_deg - true_opening_angle_deg"

# DATA SAMPLE
[samples.onbeam]
key = "onbeam"
exposure_type = "pot"
override_exposure = 2.36124e19 # CORRECTED POT
override_category = -100
trees = ['selected']

[samples.onbeam.precompute]
abs_opening_angle_residual = "reco_opening_angle_cos - reco_opening_angle_cos"
theta_mup_residual_deg = "reco_opening_angle_deg - reco_opening_angle_deg"

[samples.offbeam]
key = "offbeam"
exposure_type = "livetime"
override_category = 11
trees = ['selected']

[samples.offbeam.precompute]
abs_opening_angle_residual = "reco_opening_angle_cos - reco_opening_angle_cos"
theta_mup_residual_deg = "reco_opening_angle_deg - reco_opening_angle_deg"


# ROCK MUON SAMPLE (merged into 'Others' category with cosmics)
[samples.rock]
key = "rock"
exposure_type = "pot"
override_category = 11
trees = ['selected']

[samples.rock.precompute]
abs_opening_angle_residual = "reco_opening_angle_cos - true_opening_angle_cos"
theta_mup_residual_deg = "reco_opening_angle_deg - true_opening_angle_deg"

[output]
path = '.'

[[systematic_recipe]]
name = 'stats'
label = 'Stat.'
pattern = 'mc_statistical'

[[systematic_recipe]]
name = 'flux'
label = 'Flux'
pattern = 'hysyst*(?!\w*sigma\b)\w+\b'

[[systematic_recipe]]
name = 'xsec'
label = 'Cross-section'
pattern = '\bGENIEReWeight_SBN_v1_multisigma_\w+\b'

[[systematic_recipe]]
name = 'detsys'
label = 'Detector Systematics'
pattern = '\bvar(01|02|03|04|05|06|07|08|09)\b'

[[systematic_recipe]]
name = 'MC_total'
label = 'All Systematics (No G4)'
pattern = '^(flux|xsec|stats|detsys)$'

[analysis]
ordinate_sample = 'onbeam'
category_branch = 'true_category'
category_assignment = [[0], [1], [2], [4], [5,6,7], [8], [3], [11], [-100]]
category_labels = ['$\nu_\mu$CC0$\pi$ QE', '$\nu_\mu$CC0$\pi$ 2p2h', '$\nu_\mu$CC0$\pi$ $\pi$ abs.', '$\nu_\mu$CC1$\pi^\pm$', 'Other CC', '$\nu$ NC', '$\nu_\mu$CC0$\pi$ OOFV', 'Others', 'Data']
category_colors = ['#003087', '#4A7CC7', '#9DC3F7', '#FF8C00', '#FFD100', '#CC0000', '#2E8B57', '#FF69B4', 'black']
category_types = ['histogram', 'histogram', 'histogram', 'histogram', 'histogram','histogram','histogram', 'histogram', 'scatter']

# --- Reco distribution ---

[[figure]]
name = 'opening_angle'
type = 'SimpleFigure'
style = 'selected_icarus_data'
figsize = [5.4, 6.0]
[[figure.artists]]
type = 'SpineSpectra1D'
variable = 'reco_opening_angle'
ytitle = 'Candidates / unit cos'
yrange = 1.6
draw_kwargs = {'show_component_number' = true, 'show_component_percentage' = true, 'invert_stack_order' = true, 'normalize' = false, 'draw_error' = 'MC_total', 'draw_ratio' = 'True', 'per_bin_width' = true}

