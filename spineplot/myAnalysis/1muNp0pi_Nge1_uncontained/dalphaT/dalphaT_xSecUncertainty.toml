[[this_includes]]
file = '../../../configurations/common/dalphaT.toml'

[[this_includes]]
file = '../../../configurations/common/styles.toml'

# SIMULATION SAMPLE
[samples]
[samples.mc]
key = "full"
exposure_type = "pot"
override_exposure = 7.178e20 # CORRECTED POT
trees = ['selected']
print_sys = true
systematics = ['selected_multisigmaTree']

[samples.mc.precompute]
abs_dalphaT_residual = "reco_dalphaT_deg - true_dalphaT_deg"

[samples.mc_nonmatched]
key = "full"
exposure_type = "pot"
override_exposure = 7.178e20 # CORRECTED POT
trees = ['selected_nonmatched']

[samples.mc_nonmatched.precompute]
abs_dalphaT_residual = "reco_dalphaT_deg - true_dalphaT_deg"

# DATA SAMPLE
[samples.onbeam]
key = "onbeam"
exposure_type = "pot"
override_exposure = 2.36124e19
override_category = -100
trees = ['selected']

[samples.onbeam.precompute]
abs_dalphaT_residual = "reco_dalphaT_deg - reco_dalphaT_deg"

[samples.offbeam]
key = "offbeam"
exposure_type = "livetime"
override_category = 11
trees = ['selected']

[samples.offbeam.precompute]
abs_dalphaT_residual = "reco_dalphaT_deg - reco_dalphaT_deg"


# ROCK MUON SAMPLE (merged into 'Others' category with cosmics)
[samples.rock]
key = "rock"
exposure_type = "pot"
override_category = 11
trees = ['selected']

[samples.rock.precompute]
abs_dalphaT_residual = "reco_dalphaT_deg - true_dalphaT_deg"

[output]
path = '.'

[[systematic_recipe]]
name = 'xsec_ccqe'
label = 'CCQE'
pattern = '\bGENIEReWeight_SBN_v1_multisigma_(ZExpA[1-4]CCQE|RPA_CCQE|CoulombCCQE|VecFFCCQEshape|LowQ2Suppression)\b'

[[systematic_recipe]]
name = 'xsec_mec'
label = 'MEC'
pattern = '\bGENIEReWeight_SBN_v1_multisigma_(NormCCMEC|NormNCMEC|DecayAngMEC)\b'

[[systematic_recipe]]
name = 'xsec_res'
label = 'Resonant'
pattern = '\bGENIEReWeight_SBN_v1_multisigma_(MaNCEL|EtaNCEL|MaCCRES|MvCCRES|MaNCRES|MvNCRES|CC1piTPi|RDecBR1gamma|RDecBR1eta|Theta_Delta2Npi|ThetaDelta2NRad)\b'

[[systematic_recipe]]
name = 'xsec_nonres'
label = 'Non-resonant'
pattern = '\bGENIEReWeight_SBN_v1_multisigma_NonRESBG(vp|vn|vbarp|vbarn)(CC|NC)(1|2)pi\b'

[[systematic_recipe]]
name = 'xsec_fsi'
label = 'FSI'
pattern = '\bGENIEReWeight_SBN_v1_multisigma_(MFP|FrCEx|FrInel|FrAbs|FrPiProd)_(pi|N)\b'

[[systematic_recipe]]
name = 'xsec_other'
label = 'Other'
pattern = '\bGENIEReWeight_SBN_v1_multisigma_(NormCCCOH|NormNCCOH|AhtBY|BhtBY|CV1uBY|CV2uBY)\b'

[analysis]
ordinate_sample = 'onbeam'
category_branch = 'true_category'
category_assignment = [[0,3], [1,4], [6], [7,8,9], [10], [2,5], [11], [-100]]
category_labels = ['Signal $\nu_\mu$CC0$\pi^\pm$', 'Signal QE', '$\nu_\mu$CC1$\pi^\pm$', 'Other CC', '$\nu$NC', 'OOFV', 'Others', 'Data']
category_colors = ['#003087', '#003087', '#FF8C00', '#FFD100', '#CC0000', '#2E8B57', '#FF69B4', 'black']
category_types = ['histogram', 'histogram', 'histogram', 'histogram', 'histogram','histogram','histogram', 'scatter']

[[figure]]
name = "dalphaT_xSecUncertainty"
type = "SimpleFigure"
style = 'selected_icarus_mc'
figsize = [5, 4]
[[figure.artists]]
type = "SpineSpectra1D"
variable = "reco_dalphaT"
yrange = [0.0, 0.45]
[figure.artists.draw_kwargs]
method = "draw_systematics"
systematic_names = ["xsec_ccqe", "xsec_mec", "xsec_res", "xsec_nonres", "xsec_fsi", "xsec_other"]
fractional = true
show_total = true
show_individual = true

[[figure]]
name = "dalphaT_xSecUncertainty_contained"
type = "SimpleFigure"
style = 'selected_icarus_mc'
figsize = [5, 4]
[[figure.artists]]
type = "SpineSpectra1D"
variable = "reco_dalphaT_contained"
yrange = [0.0, 0.45]
[figure.artists.draw_kwargs]
method = "draw_systematics"
systematic_names = ["xsec_ccqe", "xsec_mec", "xsec_res", "xsec_nonres", "xsec_fsi", "xsec_other"]
fractional = true
show_total = true
show_individual = true

[[figure]]
name = "dalphaT_xSecUncertainty_exiting"
type = "SimpleFigure"
style = 'selected_icarus_mc'
figsize = [5, 4]
[[figure.artists]]
type = "SpineSpectra1D"
variable = "reco_dalphaT_exiting"
yrange = [0.0, 0.45]
[figure.artists.draw_kwargs]
method = "draw_systematics"
systematic_names = ["xsec_ccqe", "xsec_mec", "xsec_res", "xsec_nonres", "xsec_fsi", "xsec_other"]
fractional = true
show_total = true
show_individual = true