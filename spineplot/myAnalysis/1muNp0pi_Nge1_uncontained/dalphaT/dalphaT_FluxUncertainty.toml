[[this_includes]]
file = '../../../configurations/common/dalphaT.toml'

[[this_includes]]
file = '../../../configurations/common/styles.toml'

# SIMULATION SAMPLE
[samples]
[samples.mc]
key = "full"
exposure_type = "pot"
override_exposure = 7.178390e20 # CORRECTED POT
trees = ['selected']
print_sys = true
systematics = ['selected_NuMIfluxsimTree']

[samples.mc.precompute]
abs_dalphaT_residual = "reco_dalphaT_deg - true_dalphaT_deg"

[samples.mc_nonmatched]
key = "full"
exposure_type = "pot"
override_exposure = 7.178390e20 # CORRECTED POT
trees = ['selected_nonmatched']

[samples.mc_nonmatched.precompute]
abs_dalphaT_residual = "reco_dalphaT_deg - true_dalphaT_deg"

# DATA SAMPLE
[samples.onbeam]
key = "onbeam"
exposure_type = "pot"
override_exposure = 2.36124e19
override_category = -100
trees = ['selected']

[samples.onbeam.precompute]
abs_dalphaT_residual = "reco_dalphaT_deg - reco_dalphaT_deg"

[samples.offbeam]
key = "offbeam"
exposure_type = "livetime"
override_category = 11
trees = ['selected']

[samples.offbeam.precompute]
abs_dalphaT_residual = "reco_dalphaT_deg - reco_dalphaT_deg"


# ROCK MUON SAMPLE (merged into 'Others' category with cosmics)
[samples.rock]
key = "rock"
exposure_type = "pot"
override_category = 11
trees = ['selected']

[samples.rock.precompute]
abs_dalphaT_residual = "reco_dalphaT_deg - true_dalphaT_deg"

[output]
path = '.'

[[systematic_recipe]]
name = 'flux_beam_focusing'
label = 'Beam focusing'
pattern = '\bhysyst_beam_(horn_2kA|horn1_x_3mm|horn1_y_3mm|spot_1_3mm|spot_1_7mm|horn2_x_3mm|horn2_y_3mm|horns_0mm_water|horns_2mm_water|Beam_shift_x_1mm|Beam_shift_y_1mm|Target_z_7mm)\b'

[[systematic_recipe]]
name = 'flux_hadron_prod'
label = 'Hadron production'
pattern = '\bhysyst_hpc_([0-9]|1[0-4])\b'

[analysis]
ordinate_sample = 'onbeam'
category_branch = 'true_category'
category_assignment = [[0], [1], [2], [4], [5,6,7], [8], [3], [11], [-100]]
category_labels = ['$\nu_\mu$CC0$\pi$ QE', '$\nu_\mu$CC0$\pi$ 2p2h', '$\nu_\mu$CC0$\pi$ $\pi$ abs.', '$\nu_\mu$CC1$\pi^\pm$', 'Other CC', '$\nu$ NC', '$\nu_\mu$CC0$\pi$ OOFV', 'Others', 'Data']
category_colors = ['#003087', '#4A7CC7', '#9DC3F7', '#FF8C00', '#FFD100', '#CC0000', '#2E8B57', '#FF69B4', 'black']
category_types = ['histogram', 'histogram', 'histogram', 'histogram', 'histogram','histogram','histogram', 'histogram', 'scatter']

[[figure]]
name = "dalphaT_FluxUncertainty"
type = "SimpleFigure"
style = 'selected_icarus_mc'
figsize = [5, 4]
[[figure.artists]]
type = "SpineSpectra1D"
variable = "reco_dalphaT"
yrange = [0.0, 0.25]
[figure.artists.draw_kwargs]
method = "draw_systematics"
systematic_names = ["flux_beam_focusing", "flux_hadron_prod"]
fractional = true
show_total = true
show_individual = true

[[figure]]
name = "dalphaT_FluxUncertainty_contained"
type = "SimpleFigure"
style = 'selected_icarus_mc'
figsize = [5, 4]
[[figure.artists]]
type = "SpineSpectra1D"
variable = "reco_dalphaT_contained"
yrange = [0.0, 0.25]
[figure.artists.draw_kwargs]
method = "draw_systematics"
systematic_names = ["flux_beam_focusing", "flux_hadron_prod"]
fractional = true
show_total = true
show_individual = true

[[figure]]
name = "dalphaT_FluxUncertainty_exiting"
type = "SimpleFigure"
style = 'selected_icarus_mc'
figsize = [5, 4]
[[figure.artists]]
type = "SpineSpectra1D"
variable = "reco_dalphaT_exiting"
yrange = [0.0, 0.25]
[figure.artists.draw_kwargs]
method = "draw_systematics"
systematic_names = ["flux_beam_focusing", "flux_hadron_prod"]
fractional = true
show_total = true
show_individual = true