[[this_includes]]
file = '../../../configurations/common/vertex_z.toml'

[[this_includes]]
file = '../../../configurations/common/styles.toml'

[variables.abs_vertex_z_residual]
key = "abs_vertex_z_residual"
range = [-20, 20]
nbins = 50
xlabel = '$z_{\mathrm{vtx,reco}} - z_{\mathrm{vtx,true}}$ [cm] (Contained + Exiting $\mu^\pm$)'
xlabel_fontsize = 10

[variables.abs_vertex_z_residual_contained]
key = "abs_vertex_z_residual"
range = [-20, 20]
nbins = 50
xlabel = '$z_{\mathrm{vtx,reco}} - z_{\mathrm{vtx,true}}$ [cm] (Contained $\mu^\pm$)'
xlabel_fontsize = 10
mask = 'reco_leading_muon_containment == 1'

[variables.abs_vertex_z_residual_exiting]
key = "abs_vertex_z_residual"
range = [-20, 20]
nbins = 50
xlabel = '$z_{\mathrm{vtx,reco}} - z_{\mathrm{vtx,true}}$ [cm] (Exiting $\mu^\pm$)'
xlabel_fontsize = 10
mask = 'reco_leading_muon_containment == 0'

# SIMULATION SAMPLE
[samples]
[samples.mc]
key = "full"
exposure_type = "pot"
override_exposure = 7.178390e20 # CORRECTED POT
trees = ['selected']
print_sys = true
systematics = ['selected_variationTree', 'selected_multisigmaTree', 'selected_NuMIfluxsimTree']

[samples.mc.precompute]
abs_vertex_z_residual = "reco_vertex_z - true_vertex_z"

[samples.mc_nonmatched]
key = "full"
exposure_type = "pot"
override_exposure = 7.178390e20 # CORRECTED POT
trees = ['selected_nonmatched']

[samples.mc_nonmatched.precompute]
abs_vertex_z_residual = "reco_vertex_z - true_vertex_z"

# DATA SAMPLE
[samples.onbeam]
key = "onbeam"
exposure_type = "pot"
override_exposure = 2.36124e19 # CORRECTED POT
override_category = -100
trees = ['selected']

[samples.onbeam.precompute]
abs_vertex_z_residual = "reco_vertex_z - reco_vertex_z"

[samples.offbeam]
key = "offbeam"
exposure_type = "livetime"
override_category = 11
trees = ['selected']

[samples.offbeam.precompute]
abs_vertex_z_residual = "reco_vertex_z - reco_vertex_z"


# ROCK MUON SAMPLE (merged into 'Others' category with cosmics)
[samples.rock]
key = "rock"
exposure_type = "pot"
override_category = 11
trees = ['selected']

[samples.rock.precompute]
abs_vertex_z_residual = "reco_vertex_z - true_vertex_z"

[output]
path = '.'

[[systematic_recipe]]
name = 'stats'
label = 'Stat.'
pattern = 'mc_statistical'

[[systematic_recipe]]
name = 'flux'
label = 'Flux'
pattern = 'hysyst*(?!\w*sigma\b)\w+\b'

[[systematic_recipe]]
name = 'xsec'
label = 'Cross-section'
pattern = '\bGENIEReWeight_SBN_v1_multisigma_\w+\b'

[[systematic_recipe]]
name = 'detsys'
label = 'Detector Systematics'
pattern = '\bvar(01|02|03|04|05|06|07|08|09)\b'

[[systematic_recipe]]
name = 'MC_total'
label = 'All Systematics (No G4)'
pattern = '^(flux|xsec|stats|detsys)$'

[analysis]
ordinate_sample = 'onbeam'
category_branch = 'true_category'
# Categories treated as signal. The smearing figures below plot the response
# matrix R_ji of the forward model mu_j = sum_i R_ji s_i + b_j, which is a
# SIGNAL-ONLY quantity: a background event has no signal truth bin to be
# unfolded to and enters through b_j instead. Confirmed against Howard's
# convention. Without this key every category is summed and the plotted
# diagonal is diluted relative to the R the fit actually uses.
signal_categories = [0, 1, 2]
category_assignment = [[0], [1], [2], [4], [5,6,7], [8], [3], [11], [-100]]
category_labels = ['$\nu_\mu$CC0$\pi$ QE', '$\nu_\mu$CC0$\pi$ 2p2h', '$\nu_\mu$CC0$\pi$ $\pi$ abs.', '$\nu_\mu$CC1$\pi^\pm$', 'Other CC', '$\nu$ NC', '$\nu_\mu$CC0$\pi$ OOFV', 'Others', 'Data']
category_colors = ['#003087', '#4A7CC7', '#9DC3F7', '#FF8C00', '#FFD100', '#CC0000', '#2E8B57', '#FF69B4', 'black']
category_types = ['histogram', 'histogram', 'histogram', 'histogram', 'histogram','histogram','histogram', 'histogram', 'scatter']

# --- Reco distribution ---

[[figure]]
name = 'vertex_z'
type = 'SimpleFigure'
style = 'selected_icarus_data'
figsize = [5, 6]
[[figure.artists]]
type = 'SpineSpectra1D'
variable = 'reco_vertex_z'
yrange = 1.7
ytitle = 'Candidates / cm'
draw_kwargs = {'show_component_number' = true, 'show_component_percentage' = true, 'invert_stack_order' = true, 'normalize' = false, 'draw_error' = 'MC_total', 'draw_ratio' = 'True', 'per_bin_width' = true}

